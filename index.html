<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">

<link rel="manifest" href="./manifest.json">

<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;800;900&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.17.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.17.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.17.1/firebase-storage-compat.js"></script>
<style>
:root{
  --ink:#17171B; --panel:#211F27; --panel2:#2A2732; --paper:#F3EFE6; --paper2:#EAE3D3;
  --accent:#FF5A1F; --accent-ink:#5A1F00; --accent2:#2FA766; --danger:#E14B4B; --amber:#E0A227;
  --muted:#9A97A3; --line:#3A3742; --text-on-ink:#F3EFE6;
  --neutral-pill-bg:rgba(255,255,255,.1); --neutral-pill-text:#fff;
}
:root[data-theme="light"]{
  --ink:#FBF8F2; --panel:#FFFFFF; --panel2:#F1ECE0; --paper:#FFFFFF; --paper2:#F1ECE0;
  --accent:#FF5A1F; --accent-ink:#FF5A1F; --accent2:#219958; --danger:#D63C3C; --amber:#C6870F;
  --muted:#847E70; --line:#E4DDCB; --text-on-ink:#221F17;
  --neutral-pill-bg:rgba(34,31,23,.08); --neutral-pill-text:#221F17;
}
:root[data-theme="light"] .pcard{box-shadow:0 4px 14px rgba(0,0,0,.08); border:1px solid var(--line);}
:root[data-theme="light"] .pos-tile-img,:root[data-theme="light"] .app-header{box-shadow:none;}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;background:var(--ink);color:var(--text-on-ink);font-family:'Tajawal',sans-serif;}
body{padding-bottom:74px; min-height:100vh;}
h1,h2,h3,.display{font-family:'Cairo',sans-serif; font-weight:800;}
button{font-family:'Tajawal',sans-serif; cursor:pointer;}
input,select,textarea{font-family:'Tajawal',sans-serif;}
::-webkit-scrollbar{height:6px;width:6px;} ::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px;}

/* ---- shell ---- */
.app-header{position:sticky; top:0; z-index:40; background:var(--ink); padding:14px 16px 10px; border-bottom:1px solid var(--line);}
.brand-row{display:flex; align-items:center; justify-content:space-between; gap:10px;}
.brand{display:flex; align-items:center; gap:10px;}
.brand .logo{width:38px;height:38px;border-radius:10px;background:linear-gradient(145deg,var(--accent),#c93f0f); display:flex;align-items:center;justify-content:center;font-family:'Cairo';font-weight:900;font-size:18px;color:#fff; box-shadow:0 4px 14px rgba(255,90,31,.35);}
.brand .name{font-family:'Cairo';font-weight:800;font-size:18px;}
.brand .sub{font-size:11px;color:var(--muted);margin-top:-3px;}
.barcode-strip{height:5px;margin-top:10px;background-image:repeating-linear-gradient(90deg,var(--muted) 0 2px, transparent 2px 5px); opacity:.35; border-radius:3px;}
.icon-btn{background:var(--panel); border:1px solid var(--line); color:var(--text-on-ink); width:38px;height:38px;border-radius:10px; display:flex;align-items:center;justify-content:center; font-size:17px; position:relative;}
.badge-dot{position:absolute; top:-4px; left:-4px; background:var(--accent); color:#fff; font-size:10px; font-weight:800; min-width:16px; height:16px; border-radius:8px; display:flex;align-items:center;justify-content:center; padding:0 3px;}

.container{padding:14px 16px 20px; max-width:640px; margin:0 auto;}
.section-title{font-family:'Cairo'; font-weight:800; font-size:15px; margin:18px 0 10px; display:flex; align-items:center; gap:8px; color:var(--text-on-ink);}
.section-title .tag{background:var(--accent); color:#fff; font-size:10px; padding:2px 7px; border-radius:5px; font-family:'Tajawal'; font-weight:700;}

/* bottom nav */
.bottom-nav{position:fixed; bottom:0; right:0; left:0; z-index:50; background:var(--panel); border-top:1px solid var(--line); display:flex; padding:6px 6px calc(6px + env(safe-area-inset-bottom));}
.nav-btn{flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; background:none; border:none; color:var(--muted); font-size:10.5px; padding:6px 2px; border-radius:10px; position:relative;}
.nav-btn .ic{font-size:19px;}
.nav-btn.active{color:var(--accent);}
.nav-btn.active .ic{transform:translateY(-1px);}
.nav-btn .cart-badge{position:absolute; top:0; left:22%; background:var(--danger); color:#fff; font-size:9px; font-weight:800; min-width:15px; height:15px; border-radius:8px; display:flex;align-items:center;justify-content:center;}

/* filter bar */
.search-row{display:flex; gap:8px;}
.search-input{flex:1; background:var(--panel); border:1px solid var(--line); color:var(--text-on-ink); padding:11px 14px; border-radius:12px; font-size:14px;}
.search-input::placeholder{color:var(--muted);}
.scan-btn{background:var(--accent2); border:none; color:#fff; border-radius:12px; width:46px; font-size:18px;}
.filter-chips{display:flex; gap:8px; overflow-x:auto; padding:12px 0 2px; scrollbar-width:none;}
.filter-chips::-webkit-scrollbar{display:none;}
.chip{flex:none; background:var(--panel); border:1px solid var(--line); color:var(--text-on-ink); font-size:12.5px; padding:7px 13px; border-radius:20px; white-space:nowrap;}
.chip.active{background:var(--accent); border-color:var(--accent); color:#fff; font-weight:700;}
.filter-panel{background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:12px; margin-top:10px; display:none;}
.filter-panel.open{display:block;}
.fp-row{margin-bottom:10px;}
.fp-label{font-size:11.5px; color:var(--muted); margin-bottom:6px; font-weight:700;}
.pill-group{display:flex; flex-wrap:wrap; gap:6px;}
.pill{background:var(--ink); border:1px solid var(--line); color:var(--text-on-ink); font-size:12px; padding:6px 11px; border-radius:9px;}
.pill.on{background:var(--accent2); border-color:var(--accent2); color:#fff; font-weight:700;}
.range-row{display:flex; align-items:center; gap:8px;}
.range-row input[type=number]{width:80px; background:var(--ink); border:1px solid var(--line); color:var(--text-on-ink); padding:8px; border-radius:8px; font-size:13px;}

/* product grid */
.grid{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:12px;}
.pcard{background:var(--paper); border-radius:16px; overflow:hidden; color:#1b1810; display:flex; flex-direction:column; box-shadow:0 6px 18px rgba(0,0,0,.25);}
.pcard .img-wrap{position:relative; background:var(--paper2); aspect-ratio:1/0.95; display:flex;align-items:center;justify-content:center; overflow:hidden;}
.pcard img{width:100%;height:100%;object-fit:cover;}
.pcard .tag-strip{position:absolute; top:0; right:0; background:var(--ink); color:var(--text-on-ink); font-size:9.5px; padding:3px 8px; border-radius:0 0 0 10px; font-family:'Cairo'; letter-spacing:.5px;}
.pcard .low{position:absolute; top:0; left:0; background:var(--danger); color:#fff; font-size:9px; font-weight:800; padding:3px 8px; border-radius:0 0 10px 0;}
.pcard .body{padding:10px 11px 12px;}
.pcard .brand-mini{font-size:10px; color:#8a8272; font-weight:700; text-transform:uppercase; letter-spacing:.5px;}
.pcard .name{font-family:'Cairo'; font-weight:800; font-size:13.5px; margin:2px 0 5px; line-height:1.3;}
.pcard .price{font-family:'Cairo'; font-weight:900; font-size:15px; color:var(--accent-ink);}
.pcard .sizes-row{display:flex; gap:4px; margin-top:7px; flex-wrap:wrap;}
.szdot{font-size:9.5px; background:#fff; border:1px solid #d8d0bd; padding:2px 6px; border-radius:5px; font-weight:700;}
.empty-state{text-align:center; padding:50px 20px; color:var(--muted);}
.empty-state .ic{font-size:36px; margin-bottom:10px;}

/* modal / sheet */
.overlay{position:fixed; inset:0; background:rgba(10,9,12,.7); z-index:100; display:none; align-items:flex-end; justify-content:center;}
.overlay.open{display:flex;}
.sheet{background:var(--ink); width:100%; max-width:640px; max-height:92vh; overflow-y:auto; border-radius:20px 20px 0 0; padding:16px 16px calc(16px + env(safe-area-inset-bottom)); animation:slideUp .22s ease;}
@keyframes slideUp{from{transform:translateY(30px); opacity:0;} to{transform:translateY(0); opacity:1;}}
.sheet-handle{width:38px;height:4px;background:var(--line); border-radius:3px; margin:0 auto 14px;}
.sheet-close{position:absolute; left:20px; top:16px; background:var(--panel); border:1px solid var(--line); width:32px;height:32px;border-radius:10px; color:var(--text-on-ink);}
.pd-img{width:100%; aspect-ratio:1.3/1; border-radius:14px; background:var(--paper2); object-fit:cover;}
.pd-title{font-family:'Cairo'; font-weight:800; font-size:19px; margin-top:12px;}
.pd-meta{color:var(--muted); font-size:12.5px; margin-top:3px;}
.pd-price{font-family:'Cairo'; font-weight:900; font-size:22px; color:var(--accent); margin-top:8px;}
.opt-label{font-size:12.5px; color:var(--muted); font-weight:700; margin:14px 0 7px;}
.opt-row{display:flex; gap:8px; flex-wrap:wrap;}
.opt-pill{background:var(--panel); border:1px solid var(--line); color:var(--text-on-ink); padding:8px 14px; border-radius:10px; font-size:13px; font-weight:700;}
.opt-pill.sel{background:var(--accent); border-color:var(--accent);}
.opt-pill.disabled{opacity:.3; text-decoration:line-through;}
.qty-stepper{display:flex; align-items:center; gap:14px; margin-top:16px;}
.qty-stepper button{width:36px;height:36px;border-radius:10px;background:var(--panel);border:1px solid var(--line);color:var(--text-on-ink);font-size:17px;}
.big-btn{width:100%; background:var(--accent); color:#fff; border:none; padding:14px; border-radius:14px; font-family:'Cairo'; font-weight:800; font-size:15.5px; margin-top:16px; display:flex;align-items:center;justify-content:center;gap:8px;}
.big-btn.ghost{background:var(--panel); border:1px solid var(--line); color:var(--text-on-ink);}
.big-btn.green{background:var(--accent2);}
.big-btn.danger{background:var(--danger);}
.big-btn:disabled{opacity:.4;}
.big-btn.sm{padding:10px; font-size:13.5px; margin-top:8px;}

/* cart */
.cart-item{display:flex; gap:10px; background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:10px; margin-bottom:10px;}
.cart-item img{width:60px;height:60px;border-radius:10px;object-fit:cover; background:var(--paper2);}
.cart-item .info{flex:1;}
.cart-item .info .n{font-family:'Cairo'; font-weight:700; font-size:13px;}
.cart-item .info .m{font-size:11px; color:var(--muted); margin-top:2px;}
.cart-item .ctrl{display:flex; align-items:center; gap:6px; margin-top:6px;}
.cart-item .ctrl button{width:24px;height:24px;border-radius:6px; background:var(--ink); border:1px solid var(--line); color:var(--text-on-ink);}
.cart-item .price-col{text-align:left; display:flex; flex-direction:column; align-items:flex-end; justify-content:space-between;}
.cart-item .del{color:var(--danger); font-size:11px; background:none; border:none;}
.summary-row{display:flex; justify-content:space-between; font-size:13.5px; padding:6px 0; color:var(--muted);}
.summary-row.total{color:var(--text-on-ink); font-family:'Cairo'; font-weight:800; font-size:16px; border-top:1px solid var(--line); margin-top:6px; padding-top:12px;}
.field{width:100%; background:var(--panel); border:1px solid var(--line); color:var(--text-on-ink); padding:12px; border-radius:12px; margin-top:8px; font-size:14px;}
.field::placeholder{color:var(--muted);}
label.fl{font-size:12px; color:var(--muted); font-weight:700; margin-top:12px; display:block;}

/* status */
.status-track{display:flex; justify-content:space-between; position:relative; margin:22px 0 8px;}
.status-track:before{content:''; position:absolute; top:14px; right:6%; left:6%; height:3px; background:var(--line); z-index:0;}
.st-step{flex:1; text-align:center; position:relative; z-index:1;}
.st-dot{width:28px;height:28px; border-radius:50%; background:var(--panel); border:2px solid var(--line); margin:0 auto 6px; display:flex;align-items:center;justify-content:center; font-size:13px;}
.st-step.done .st-dot{background:var(--accent2); border-color:var(--accent2); color:#fff;}
.st-step.now .st-dot{background:var(--accent); border-color:var(--accent); color:#fff;}
.st-step .st-label{font-size:10.5px; color:var(--muted);}
.st-step.done .st-label, .st-step.now .st-label{color:var(--text-on-ink); font-weight:700;}

.order-card{background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:12px; margin-bottom:12px;}
.order-card .top{display:flex; justify-content:space-between; align-items:flex-start;}
.order-card .oid{font-family:'Cairo'; font-weight:800; font-size:13.5px;}
.order-card .odate{font-size:10.5px; color:var(--muted); margin-top:2px;}
.status-pill{font-size:10.5px; font-weight:800; padding:4px 10px; border-radius:20px;}
.status-pill.prep{background:rgba(224,162,39,.18); color:var(--amber);}
.status-pill.shipped{background:rgba(47,167,102,.18); color:var(--accent2);}
.status-pill.delivered{background:var(--neutral-pill-bg); color:var(--neutral-pill-text);}
.status-pill.cancelled{background:rgba(225,75,75,.18); color:var(--danger);}

/* admin */
.admin-tabs{display:flex; flex-wrap:wrap; gap:7px; padding-bottom:2px;}
.admin-actions{display:flex; justify-content:space-between; gap:8px; margin-top:8px;}
.admin-actions .atab{flex:1; text-align:center;}
.atab{flex:none; background:var(--panel); border:1px solid var(--line); color:var(--text-on-ink); font-size:12px; padding:8px 13px; border-radius:11px; font-weight:700;}
.atab.active{background:var(--accent); border-color:var(--accent); color:#fff;}
.atab#btnRefreshData{background:var(--accent2); border-color:var(--accent2); color:#fff;}
.atab#btnRefreshData:disabled{opacity:.7;}
.atab#btnRefreshData .spin-ic{display:inline-block;}
.atab#btnRefreshData.spinning .spin-ic{animation:refreshSpin .8s linear infinite;}
@keyframes refreshSpin{ from{transform:rotate(0deg);} to{transform:rotate(360deg);} }
.kpi-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:12px;}
.kpi{background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:13px;}
.kpi .l{font-size:11px; color:var(--muted); font-weight:700;}
.kpi .v{font-family:'Cairo'; font-weight:900; font-size:19px; margin-top:5px;}
.kpi.accent .v{color:var(--accent);}
.kpi.green .v{color:var(--accent2);}
.kpi.danger .v{color:var(--danger);}
.alert-box{background:rgba(225,75,75,.1); border:1px solid rgba(225,75,75,.35); border-radius:12px; padding:10px 12px; margin-top:12px; font-size:12.5px;}
.alert-box b{color:var(--danger);}
.list-row{display:flex; justify-content:space-between; align-items:center; background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:11px 13px; margin-bottom:9px;}
.list-row .main{font-family:'Cairo'; font-weight:700; font-size:13.5px;}
.list-row .sub{font-size:11px; color:var(--muted); margin-top:3px;}
.mini-btn{background:var(--ink); border:1px solid var(--line); color:var(--text-on-ink); padding:6px 10px; border-radius:8px; font-size:11.5px;}
.mini-btn.danger{color:var(--danger); border-color:rgba(225,75,75,.4);}
.mini-btn.green{color:var(--accent2); border-color:rgba(47,167,102,.4);}
.an-rank{display:flex; align-items:center; justify-content:center; width:24px; height:24px; border-radius:50%; font-size:11px; font-weight:800; flex:none; font-family:'Cairo';}
.an-rank.opp{background:rgba(47,167,102,.18); color:var(--accent2);}
.an-rank.thr{background:rgba(225,75,75,.18); color:var(--danger);}
.an-bar-wrap{background:var(--ink); border-radius:6px; height:6px; margin-top:6px; overflow:hidden;}
.an-bar{height:100%; border-radius:6px;}
.an-bar.opp{background:var(--accent2);}
.an-bar.thr{background:var(--danger);}
.an-note{background:var(--panel); border:1px dashed var(--line); border-radius:12px; padding:10px 12px; font-size:11.5px; color:var(--muted); margin-bottom:12px;}
.two-col{display:grid; grid-template-columns:1fr 1fr; gap:8px;}
.size-matrix{display:grid; grid-template-columns:repeat(auto-fill,minmax(70px,1fr)); gap:8px; margin-top:8px;}
.sm-cell{background:var(--ink); border:1px solid var(--line); border-radius:10px; padding:7px; text-align:center;}
.sm-cell .sz{font-size:11px; color:var(--muted); font-weight:700;}
.sm-cell input{width:100%; background:transparent; border:none; color:var(--text-on-ink); text-align:center; font-family:'Cairo'; font-weight:800; font-size:14px; margin-top:2px;}
.sm-cell.low{border-color:var(--danger);}
.color-tag{display:inline-flex; align-items:center; gap:5px; background:var(--ink); border:1px solid var(--line); padding:4px 9px; border-radius:8px; font-size:11.5px; margin:2px;}
.color-tag button{background:none;border:none;color:var(--danger);font-weight:800; padding:0 2px;}
.tabbar-scroll{position:sticky; top:0; background:var(--ink); z-index:30; padding-top:2px; padding-bottom:8px; margin-bottom:6px;}

/* pos */
.pos-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:9px; margin-top:10px;}
.pos-tile{display:flex; flex-direction:column; align-items:center; gap:4px; background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:8px 6px 9px; text-align:center; color:var(--text-on-ink);}
.pos-tile.active{border-color:var(--accent2); box-shadow:0 0 0 2px rgba(47,167,102,.35);}
.pos-tile-img{width:100%; aspect-ratio:1/1; border-radius:10px; overflow:hidden; background:var(--paper2); display:flex; align-items:center; justify-content:center;}
.pos-tile-img img{width:100%; height:100%; object-fit:cover;}
.pos-tile-name{font-family:'Cairo'; font-weight:700; font-size:11px; line-height:1.25; max-height:2.6em; overflow:hidden;}
.pos-tile-price{font-family:'Cairo'; font-weight:900; font-size:11.5px; color:var(--accent);}
.pos-tile-opts{grid-column:1/-1; background:var(--panel2); border:1px solid var(--accent2); border-radius:12px; padding:10px;}
.pos-cart{max-height:36vh; overflow-y:auto; margin-top:10px;}
.pos-row{display:flex; justify-content:space-between; align-items:center; padding:8px 0; border-bottom:1px solid var(--line);}
.pos-row .n{font-size:12.5px; font-weight:700;}
.pos-row .m{font-size:10.5px; color:var(--muted);}

/* login */
.login-wrap{min-height:80vh; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:20px;}
.pin-dots{display:flex; gap:12px; margin:20px 0;}
.pin-dots span{width:14px;height:14px;border-radius:50%; background:var(--panel); border:1px solid var(--line);}
.pin-dots span.f{background:var(--accent); border-color:var(--accent);}
.keypad{display:grid; grid-template-columns:repeat(3,1fr); gap:12px; width:100%; max-width:280px;}
.keypad button{padding:16px; font-size:18px; border-radius:14px; background:var(--panel); border:1px solid var(--line); color:var(--text-on-ink); font-family:'Cairo'; font-weight:700;}

.toast{position:fixed; bottom:90px; right:50%; transform:translateX(50%); background:#fff; color:#141215; padding:11px 18px; border-radius:12px; font-size:13px; font-weight:700; z-index:200; box-shadow:0 8px 24px rgba(0,0,0,.3); display:none; max-width:90%; text-align:center;}
.toast.show{display:block; animation:toastIn .2s ease;}
@keyframes toastIn{from{opacity:0; transform:translate(50%,10px);} to{opacity:1; transform:translate(50%,0);}}
.toast.err{background:var(--danger); color:#fff;}
.toast.ok{background:var(--accent2); color:#fff;}

#reader{width:100%; border-radius:14px; overflow:hidden; margin-top:10px;}
.scan-hint{font-size:11.5px; color:var(--muted); text-align:center; margin-top:8px;}

@media print{
  body *{visibility:hidden;}
  #printArea, #printArea *{visibility:visible;}
  #printArea{position:fixed; top:0; right:0; left:0; padding:20px; color:#000; background:#fff;}
  .no-print{display:none!important;}
}

/* ================= صور المنتجات: تُرفع على Firebase Storage بدل تخزينها base64 جوه مستند فايرستور =================
   السبب: مستند فايرستور محدود بـ1 ميجابايت، ولو الصور اتخزنت جوه المنتج نفسه (base64) هيتعدى الحد بسرعة
   مع تراكم الأصناف. فبدل كده بنرفع الصورة على Storage ونخزن رابط تحميلها (URL قصير) بس جوه المنتج. */
async function uploadProductImage(dataUrl, productId, idx, onProgress){
  const path = `shops/${fbUser.uid}/products/${productId}/img_${idx}_${Date.now()}.jpg`;
  const ref = fbStorage.ref(path);
  const task = ref.putString(dataUrl, 'data_url', {contentType:'image/jpeg'});
  await new Promise((resolve, reject)=>{
    // مهلة 10 ثواني: لو الرفع مش بيتحرك (مثلاً لأن Storage مش مفعّل في المشروع)،
    // نلغي المحاولة ونرجع نستخدم نسخة الصورة المحلية بدل ما التطبيق يفضل معلّق للأبد
    const timeoutId = setTimeout(()=>{
      task.cancel();
      reject(new Error('upload-timeout'));
    }, 10000);
    task.on('state_changed',
      snap=>{
        const pct = Math.round((snap.bytesTransferred / snap.totalBytes) * 100);
        if(onProgress) onProgress(pct);
      },
      err=>{ clearTimeout(timeoutId); reject(err); },
      ()=>{ clearTimeout(timeoutId); resolve(); }
    );
  });
  return await task.snapshot.ref.getDownloadURL();
}
async function uploadProductImages(images, productId, onOverallProgress){
  const out = [];
  const rawPhotoIdxs = images
    .map((im,i)=> ({im,i}))
    .filter(({im})=> typeof im === 'string' && im.startsWith('data:image') && !im.startsWith('data:image/svg+xml'));
  const totalToUpload = rawPhotoIdxs.length;
  let uploadedCount = 0;
  for(let i=0;i<images.length;i++){
    const im = images[i];
    const isRawPhoto = typeof im === 'string' && im.startsWith('data:image') && !im.startsWith('data:image/svg+xml');
    if(isRawPhoto && fbUser){
      try{
        out.push(await uploadProductImage(im, productId, i, pct=>{
          if(onOverallProgress){
            const overall = Math.round(((uploadedCount + pct/100) / totalToUpload) * 100);
            onOverallProgress(overall, uploadedCount+1, totalToUpload);
          }
        }));
        uploadedCount++;
      }
      catch(err){ console.error('image upload failed, keeping local copy', err); out.push(im); uploadedCount++; }
    } else {
      out.push(im);
    }
  }
  return out;
}

function ordersRef(uid){ return shopDocRef(uid).collection('orders'); }

function subscribeOrders(uid){

// ترحيل تلقائي (مرة واحدة فقط) للطلبات القديمة اللي كانت متخزنة جوه مستند المحل نفسه
async function migrateOrdersIfNeeded(uid, legacyOrders){
  if(!legacyOrders || !legacyOrders.length) return;
  try{
    const chunkSize = 400; // أقل من حد الـ500 كتابة لكل batch في فايرستور
    for(let i=0;i<legacyOrders.length;i+=chunkSize){
      const batch = fbStore.batch();
      legacyOrders.slice(i,i+chunkSize).forEach(o=> batch.set(ordersRef(uid).doc(o.id), o));
      await batch.commit();
    }
    await shopDocRef(uid).update({'db.orders': firebase.firestore.FieldValue.delete(), 'meta.ordersMigrated': true});
    console.log('تم ترحيل', legacyOrders.length, 'طلب لمستندات منفصلة');
  }catch(err){
    console.error('orders migration failed', err);
  }
}

      const snap = await shopDocRef(fbUser.uid).get();
      if(snap.exists){
        const data = snap.data() || {};
        const currentView = DB && DB.currentView;
        DB = data.db || DB;
        dbMeta = data.meta || dbMeta;
        if(currentView) DB.currentView = currentView;
        ensureDBDefaults();
        try{ localStorage.setItem(DB_KEY, JSON.stringify(DB)); }catch(e){}
      }
      try{
        const osnap = await ordersRef(fbUser.uid).get();
        DB.orders = osnap.docs.map(d=> d.data());
      }catch(oErr){ console.warn('orders refresh skipped', oErr); }
      fetchedOk = true;
    }
  }catch(err){
    console.error('manual refresh failed', err);
  }finally{
    render();
    if(fetchedOk){
      toast('تم تحديث البيانات ✓','ok');
    } else if(navigator.onLine===false){
      toast('مفيش اتصال بالنت دلوقتي، بتشوف آخر نسخة محفوظة على الجهاز','err');

  }
}

  }, err=>{
    console.error('Firestore sync error', err);
    toast('تعذر الاتصال بالسحابة، هيتم العمل من آخر نسخة محفوظة على الجهاز','err');

    const raw = localStorage.getItem(DB_KEY);
    DB = raw ? JSON.parse(raw) : seedDB();
    ensureDBDefaults();
    setNav(DB.currentView || 'shop');
  });
}

function trialDaysLeft(){
  if(!dbMeta.trialStart) return TRIAL_DAYS; // لسه بيتسجل وقت الإنشاء (serverTimestamp)
  const start = dbMeta.trialStart.toDate ? dbMeta.trialStart.toDate() : new Date(dbMeta.trialStart);
  const passed = Math.floor((new Date() - start) / (1000*60*60*24));
  return TRIAL_DAYS - passed;
}
function isActivated(){ return !!dbMeta.activated; }
function computeActivationCode(shopCode){
  const str = (shopCode||'').toUpperCase() + '|' + LICENSE_SECRET;
  let h1 = 5381, h2 = 52711;
  for(let i=0;i<str.length;i++){
    const ch = str.charCodeAt(i);
    h1 = ((h1<<5)+h1+ch) >>> 0;   // djb2
    h2 = ((h2*33) ^ ch) >>> 0;
  }
  const combined = (h1 ^ h2) >>> 0;
  const code = combined.toString(36).toUpperCase().padStart(8,'0').slice(0,8);
  return code.slice(0,4)+'-'+code.slice(4,8);
}
function tryActivate(inputCode){
  const code = (inputCode||'').trim().toUpperCase();
  if(!code || !fbUser) return false;
  if(code === OWNER_CODE.toUpperCase() || code === computeActivationCode(dbMeta.shopCode)){
    dbMeta.activated = true;
    shopDocRef(fbUser.uid).set({meta:{activated:true}}, {merge:true}).catch(err=> console.error(err));
    return true;
  }
  return false;
}

function bindLoginGate(mode){
  const c = document.getElementById('mainContainer');
  bindAppInfoButton();
  const errBox = ()=> c.querySelector('#loginErrMsg');
  const setErr = msg=>{ const b=errBox(); if(b) b.textContent = msg||''; };
  const btnTabLogin = c.querySelector('#tabLogin');
  if(btnTabLogin) btnTabLogin.addEventListener('click', ()=>{ c.innerHTML = renderLoginGate('login'); bindLoginGate('login'); });
  const btnTabSignup = c.querySelector('#tabSignup');
  if(btnTabSignup) btnTabSignup.addEventListener('click', ()=>{ c.innerHTML = renderLoginGate('signup'); bindLoginGate('signup'); });

  const btnSignup = c.querySelector('#btnDoSignup');
  if(btnSignup) btnSignup.addEventListener('click', ()=>{
    const shopName = c.querySelector('#lgShopName').value.trim();
    const email = c.querySelector('#lgEmail').value.trim();
    const pass = c.querySelector('#lgPassword').value;
    if(!shopName){ setErr('من فضلك أدخل اسم المحل'); return; }
    if(!email || !pass || pass.length<6){ setErr('البريد وكلمة السر (6 أحرف على الأقل) مطلوبين'); return; }
    setErr('جاري إنشاء الحساب...');
    fbAuth.createUserWithEmailAndPassword(email, pass).then(cred=>{
      const shopCode = cred.user.uid.slice(0,8).toUpperCase();
      const initialDb = seedDB();
      initialDb.settings.shopName = shopName;
      initialDb.settings.setupDone = false;
      return shopDocRef(cred.user.uid).set({
        db: initialDb,
        meta: {shopCode, email: cred.user.email||email, activated:false, trialStart: firebase.firestore.FieldValue.serverTimestamp(), createdAt: firebase.firestore.FieldValue.serverTimestamp()}
      });
    }).catch(err=> setErr(loginErrorAr(err)));
  });

  const btnLogin = c.querySelector('#btnDoLogin');
  if(btnLogin) btnLogin.addEventListener('click', ()=>{
    const email = c.querySelector('#lgEmail').value.trim();
    const pass = c.querySelector('#lgPassword').value;
    if(!email || !pass){ setErr('من فضلك أدخل البريد وكلمة السر'); return; }
    setErr('جاري الدخول...');
    fbAuth.signInWithEmailAndPassword(email, pass).catch(err=> setErr(loginErrorAr(err)));
  });

  const btnForgot = c.querySelector('#btnForgotPassword');
  if(btnForgot) btnForgot.addEventListener('click', ()=>{
    const email = c.querySelector('#lgEmail').value.trim();
    if(!email){ setErr('اكتب البريد الإلكتروني الأول عشان نبعتلك رابط الاسترجاع'); return; }
    fbAuth.sendPasswordResetEmail(email).then(()=> setErr('تم إرسال رابط استرجاع كلمة السر على بريدك ✓')).catch(err=> setErr(loginErrorAr(err)));
  });
}
function loginErrorAr(err){
  const map = {
    'auth/email-already-in-use':'البريد ده متسجل بالفعل، جرّب تدخل بدل ما تعمل حساب جديد',
    'auth/invalid-email':'صيغة البريد الإلكتروني غير صحيحة',
    'auth/weak-password':'كلمة السر ضعيفة، لازم 6 أحرف على الأقل',
    'auth/user-not-found':'مفيش حساب بهذا البريد',
    'auth/wrong-password':'كلمة السر غير صحيحة',
    'auth/invalid-credential':'البريد أو كلمة السر غير صحيحين',
    'auth/too-many-requests':'محاولات كتير غلط، حاول تاني بعد شوية',
  };
  return map[err.code] || ('حصل خطأ: ' + (err.message||''));
}
function doLogout(){
  if(unsubscribeShop){ unsubscribeShop(); unsubscribeShop=null; }
  if(unsubscribeOrders){ unsubscribeOrders(); unsubscribeOrders=null; }
  fbAuth.signOut();
}

  if(!fbUser) return;

    const dbForCloud = {...DB};

function escapeXml(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function placeholderImg(text){
  text = text || 'كوتشي';

  return 'data:image/svg+xml;utf8,' + encodeURIComponent(svg);
}
function productImg(p, idx){ idx = idx||0; return (p.images && p.images[idx]) ? p.images[idx] : placeholderImg(p.name); }
function compressImageFile(file, maxW, quality){
  maxW = maxW || 640; quality = quality || 0.72;
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = e=>{
      const img = new Image();
      img.onload = ()=>{
        const scale = Math.min(1, maxW/img.width);
        const w = Math.max(1, Math.round(img.width*scale)), h = Math.max(1, Math.round(img.height*scale));
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = ()=> reject(new Error('image load failed'));
      img.src = e.target.result;
    };
    reader.onerror = ()=> reject(new Error('file read failed'));
    reader.readAsDataURL(file);
  });
}

function addToCart(pid,size,color,qty){
  const p = DB.products.find(x=>x.id===pid);
  const stock = getInv(pid,size,color);
  if(stock<=0){ toast('غير متوفر بهذا المقاس','err'); return; }
  qty = Math.min(qty, stock);
  const existing = DB.cart.find(i=>i.productId===pid && i.size===size && i.color===color);
  if(existing){ existing.qty = Math.min(existing.qty+qty, stock); }
  else DB.cart.push({productId:pid, size, color, qty, price:p.price, name:p.name, image:p.images[0]});
  saveDB(); updateCartBadge(); toast('تمت الإضافة إلى السلة ✓','ok'); closeSheet();
}

function changeCartQty(idx, delta){
  const item = DB.cart[idx]; if(!item) return;
  const stock = getInv(item.productId, item.size, item.color);
  item.qty = Math.max(1, Math.min(item.qty+delta, stock||item.qty));
  saveDB(); render();
}

function checkout(){
  const name = document.getElementById('custName').value.trim();
  const phone = document.getElementById('custPhone').value.trim();
  const address = document.getElementById('custAddress').value.trim();
  if(!name || !phone){ toast('من فضلك أدخل الاسم ورقم الموبايل','err'); return; }
  if(DB.cart.length===0){ toast('السلة فارغة','err'); return; }
  // validate stock again
  for(const i of DB.cart){ if(getInv(i.productId,i.size,i.color) < i.qty){ toast('الكمية غير متوفرة لأحد المنتجات، برجاء تعديل السلة','err'); render(); return; } }

  let customer = DB.customers.find(c=>c.phone===phone);
  if(!customer){ customer = {id:uid('c_'), name, phone, address, notes:''}; DB.customers.push(customer); }
  else { customer.name=name; customer.address=address||customer.address; }

  const total = DB.cart.reduce((s,i)=>s+i.price*i.qty,0);
  const order = {
    id: 'ORD-'+Date.now().toString().slice(-6), type:'online', customerId:customer.id, customerName:name, customerPhone:phone, address,
    items: DB.cart.map(i=>({productId:i.productId, name:i.name, size:i.size, color:i.color, qty:i.qty, price:i.price})),
    total, status:'قيد التجهيز', date: new Date().toISOString(), paymentMethod:'كاش عند الاستلام'
  };
  DB.orders.push(order);
  saveOrderRemote(order);
  DB.cart.forEach(i=> adjInv(i.productId, i.size, i.color, -i.qty));
  DB.cart = [];
  saveDB();

  const lines = order.items.map(i=>`• ${i.name} | مقاس ${i.size} | ${i.color} × ${i.qty} = ${money(i.price*i.qty)}`).join('%0A');
  const msg = `طلب جديد رقم ${order.id}%0Aالاسم: ${name}%0Aالموبايل: ${phone}%0Aالعنوان: ${address}%0A${lines}%0Aالإجمالي: ${money(total)}`;
  const wa = DB.settings.whatsapp.replace(/[^0-9]/g,'');
  window.open(`https://wa.me/${wa}?text=${msg}`, '_blank');
  toast('تم إرسال الطلب بنجاح ✓','ok');
  localStorage.setItem('lastOrderPhone', phone);
  setNav('orders');
}

/* ================= ADMIN DASHBOARD ================= */
function todayStr(){ return new Date().toISOString().slice(0,10); }
function monthStr(){ return new Date().toISOString().slice(0,7); }
function computeFinance(scopeFn){
  const orders = DB.orders.filter(o=>o.status!=='ملغي' && scopeFn(o.date));
  const revenue = orders.reduce((s,o)=>s+o.total,0);
  let cogs = 0;
  orders.forEach(o=> o.items.forEach(i=>{ const p = DB.products.find(pp=>pp.id===i.productId); cogs += (p? p.cost:0) * i.qty; }));
  const expenses = DB.expenses.filter(e=> scopeFn(e.date)).reduce((s,e)=>s+e.amount,0);
  return {revenue, cogs, expenses, profit: revenue - cogs - expenses, count:orders.length};
}
function computeCashFlow(scopeFn){
  const revenue = DB.orders.filter(o=>o.status!=='ملغي' && scopeFn(o.date)).reduce((s,o)=>s+o.total,0);
  const distributorCollections = DB.distributorLedger.filter(t=>t.type==='collection' && scopeFn(t.date)).reduce((s,t)=>s+t.amount,0);
  const expensesTotal = DB.expenses.filter(e=>scopeFn(e.date)).reduce((s,e)=>s+e.amount,0);
  const supplierPayments = DB.supplierLedger.filter(t=>t.type==='payment' && scopeFn(t.date)).reduce((s,t)=>s+t.amount,0);
  const cashIn = revenue + distributorCollections;
  const cashOut = expensesTotal + supplierPayments;
  return {revenue, distributorCollections, cashIn, expensesTotal, supplierPayments, cashOut, net: cashIn - cashOut};
}

async function saveProduct(pid){
  const name = document.getElementById('pf_name').value.trim();
  const brand = document.getElementById('pf_brand').value.trim();
  const gender = document.getElementById('pf_gender').value;
  const material = document.getElementById('pf_material').value.trim();
  const price = Number(document.getElementById('pf_price').value)||0;
  const cost = Number(document.getElementById('pf_cost').value)||0;
  const barcode = document.getElementById('pf_barcode').value.trim();
  let images = (window._pfImages && window._pfImages.length) ? window._pfImages.slice() : [placeholderImg(name||'كوتشي')];
  const colors = document.getElementById('pf_colors').value.split(',').map(s=>s.trim()).filter(Boolean);
  const sizes = document.getElementById('pf_sizes').value.split(',').map(s=>s.trim()).filter(Boolean);
  if(!name || !brand || colors.length===0 || sizes.length===0){ toast('من فضلك أكمل كل الحقول الأساسية','err'); return; }

  const productId = pid || uid('p_');
  const btn = document.getElementById('btnSaveProduct');
  if(btn){ btn.disabled = true; btn.textContent = 'جارٍ رفع الصور... 0%'; }
  try{
    images = await uploadProductImages(images, productId, (overallPct, imgNum, totalImgs)=>{
      if(btn) btn.textContent = totalImgs>1
        ? `جارٍ رفع الصور... ${overallPct}% (${imgNum}/${totalImgs})`
        : `جارٍ رفع الصورة... ${overallPct}%`;
    });
  }catch(err){
    console.error('uploadProductImages failed', err);
  }
  if(btn){ btn.disabled = false; btn.textContent = '💾 حفظ المنتج'; }

  if(pid){
    const p = DB.products.find(x=>x.id===pid);
    Object.assign(p, {name,brand,gender,material,price,cost,barcode,colors,sizes,images});
  } else {
    const np = {id:productId, name,brand,gender,material,price,cost,barcode,colors,sizes,images};
    DB.products.push(np);
    sizes.forEach(sz=> colors.forEach(c=> setInv(np.id,sz,c,0)));
  }
  saveDB(); toast('تم الحفظ ✓','ok'); closeSheet(); render();
}

  DB.products = DB.products.filter(p=>p.id!==pid);

function computeVat(subtotal){
  const rate = Number(DB.settings.vatRate)||0;
  if(DB.settings.pricesIncludeVat){
    const net = rate>0 ? subtotal/(1+rate/100) : subtotal;
    return {net, vat: subtotal-net, grand: subtotal, rate};
  }
  const vat = subtotal * rate/100;
  return {net: subtotal, vat, grand: subtotal+vat, rate};
}

    window._pos.activeProduct = (window._pos.activeProduct===pid)? null : pid;
    grid.innerHTML = posGridHTML(window._pos.query);
    bindPosGrid();
  }));
  grid.querySelectorAll('[data-pos-add]').forEach(el=> el.addEventListener('click', (ev)=>{
    ev.stopPropagation();
    const [pid,sz,cl] = el.dataset.posAdd.split('|');
    posAdd(pid,sz,cl);
  }));
}
function posAdd(pid,size,color){
  const p = DB.products.find(x=>x.id===pid);
  const stock = getInv(pid,size,color);
  const existing = window._pos.cart.find(i=>i.productId===pid && i.size===size && i.color===color);
  if(existing){ if(existing.qty<stock) existing.qty++; else { toast('لا يوجد مخزون كافٍ','err'); return; } }
  else window._pos.cart.push({productId:pid, name:p.name, size, color, qty:1, price:p.price});
  toast('تمت الإضافة للسلة ✓','ok');
  render();
}
function completeSale(){
  if(window._pos.cart.length===0) return;
  const source = document.getElementById('posOrderSource').value; // 'pos' أو 'whatsapp'
  const name = document.getElementById('posCustName').value.trim() || 'عميل نقدي';
  const phone = document.getElementById('posCustPhone').value.trim();
  if(source==='whatsapp' && !phone){ toast('من فضلك أدخل رقم موبايل العميل لطلبات الواتساب/التليفون','err'); return; }
  let address = '', manualOrderNo = '', waMessage = '', orderDateVal = null;
  if(source==='whatsapp'){
    address = (document.getElementById('posCustAddress')||{}).value?.trim() || '';
    manualOrderNo = (document.getElementById('posOrderNo')||{}).value?.trim() || '';
    waMessage = (document.getElementById('posWaMessage')||{}).value?.trim() || '';
    const dateInput = (document.getElementById('posOrderDate')||{}).value;
    if(dateInput){ const dt = new Date(dateInput); if(!isNaN(dt.getTime())) orderDateVal = dt.toISOString(); }
  }
  let customerId = null;
  if(phone){
    let cust = DB.customers.find(c=>c.phone===phone);
    if(!cust){ cust = {id:uid('c_'), name, phone, address, notes:''}; DB.customers.push(cust); }
    else if(address){ cust.address = address; }
    customerId = cust.id;
  }
  const subtotal = window._pos.cart.reduce((s,i)=>s+i.price*i.qty,0);
  const isTax = !!window._pos.taxInvoice;
  const vb = computeVat(subtotal);
  let invoiceNo = null;
  if(isTax){ invoiceNo = DB.settings.invoiceSeq; DB.settings.invoiceSeq = DB.settings.invoiceSeq + 1; }
  const order = {
    id:(source==='whatsapp'?'WA-':'POS-')+Date.now().toString().slice(-6), type: source==='whatsapp'?'online':'pos', customerId, customerName:name, customerPhone:phone,
    address, manualOrderNo, waMessage,
    items: window._pos.cart.map(i=>({productId:i.productId,name:i.name,size:i.size,color:i.color,qty:i.qty,price:i.price})),
    total:subtotal, status: source==='whatsapp'?'قيد التجهيز':'تم التسليم', date: orderDateVal || new Date().toISOString(), paymentMethod:'كاش',
    isTaxInvoice:isTax, invoiceNo, netAmount:vb.net, vatAmount:vb.vat, vatRate:vb.rate
  };
  DB.orders.push(order);
  saveOrderRemote(order);
  window._pos.cart.forEach(i=> adjInv(i.productId,i.size,i.color,-i.qty));
  saveDB();
  printInvoice(order);
  window._pos.cart = [];
  window._pos.activeProduct = null;
  window._pos.orderSource = 'pos';
  if(source==='whatsapp'){
    sendPrepStartWhatsApp(order);
    toast('تم تسجيل طلب الواتساب ✓ (حالته: قيد التجهيز) — جاري فتح واتساب لإرسال رسالة التجهيز للعميل','ok');
  } else {
    toast('تم إتمام البيع ✓','ok');
  }
  render();
}
function sendPrepStartWhatsApp(order){
  if(!order.customerPhone) return;
  const s = DB.settings;
  const refLine = order.manualOrderNo ? `مرجع الطلب لديك: ${order.manualOrderNo}%0A` : '';
  const msg = `أهلاً ${order.customerName} 👋%0Aتم استلام طلبك رقم ${order.id}%0A${refLine}جاري تجهيز طلبك الآن وهنبلغك أول ما يتم الشحن.%0Aشكراً لتسوقك من ${s.shopName} 👟`;
  const custPhone = order.customerPhone.replace(/[^0-9]/g,'');
  const waPhone = custPhone.startsWith('20') ? custPhone : ('20' + custPhone.replace(/^0/,''));
  window.open(`https://wa.me/${waPhone}?text=${msg}`, '_blank');
}

function confirmPublicOrderStock(oid){
  const o = DB.orders.find(x=>x.id===oid); if(!o) return;
  if(o._stockConfirmed){ toast('تم خصم المخزون لهذا الطلب من قبل','err'); return; }
  let short = false;
  o.items.forEach(i=>{
    const avail = getInv(i.productId, i.size, i.color);
    if(avail < i.qty) short = true;
    adjInv(i.productId, i.size, i.color, -i.qty);
  });
  o._stockConfirmed = true;
  saveOrderRemote(o); saveDB(); render();
  toast(short? '⚠️ تم الخصم لكن الكمية كانت غير كافية لبعض الأصناف — راجع المخزون' : 'تم تأكيد الطلب وخصم المخزون ✓', short?'err':'ok');
}
function deleteOrder(oid){
  const o = DB.orders.find(x=>x.id===oid); if(!o) return;
  if(!confirm('حذف الطلب سيرجّع كل الأصناف الغير مرتجعة إلى المخزون. هل أنت متأكد؟')) return;
  if(o.status!=='ملغي'){
    o.items.forEach((i,idx)=>{
      const remaining = i.qty - returnedQtyForOrderItem(oid, idx);
      if(remaining>0) adjInv(i.productId,i.size,i.color, remaining);
    });
  }
  if(o.shipping && o.shipping._expenseId){ DB.expenses = DB.expenses.filter(e=>e.id!==o.shipping._expenseId); }
  if(o.shipping && o.shipping._deliveryExpenseId){ DB.expenses = DB.expenses.filter(e=>e.id!==o.shipping._deliveryExpenseId); }
  if(o.shipping && o.shipping._deliverySupplierTxId){ DB.supplierLedger = DB.supplierLedger.filter(t=>t.id!==o.shipping._deliverySupplierTxId); }
  DB.orders = DB.orders.filter(x=>x.id!==oid);
  DB.returns = DB.returns.filter(r=>r.orderId!==oid);
  deleteOrderRemote(oid);
  saveDB(); render(); toast('تم حذف الطلب','ok');
}
function setOrderStatus(oid, status){
  const o = DB.orders.find(x=>x.id===oid); if(!o) return;
  if(status==='ملغي' && o.status!=='ملغي'){
    o.items.forEach((i,idx)=>{
      const remaining = i.qty - returnedQtyForOrderItem(oid, idx); // نتفادى إرجاع كمية سبق ردها بالفعل كمرتجع
      if(remaining>0) adjInv(i.productId,i.size,i.color, remaining);
    });
    if(o.shipping && o.shipping._expenseId){ DB.expenses = DB.expenses.filter(e=>e.id!==o.shipping._expenseId); o.shipping._expenseId=null; }
    if(o.shipping && o.shipping._deliveryExpenseId){ DB.expenses = DB.expenses.filter(e=>e.id!==o.shipping._deliveryExpenseId); o.shipping._deliveryExpenseId=null; }
    if(o.shipping && o.shipping._deliverySupplierTxId){ DB.supplierLedger = DB.supplierLedger.filter(t=>t.id!==o.shipping._deliverySupplierTxId); o.shipping._deliverySupplierTxId=null; }
  }
  // لما الطلب يتسجل "تم التسليم" ومصاريف الشحن كانت على حساب العميل (محصّلة معاه ضمن قيمة الطلب/COD):
  // المبلغ ده بقى مديونية على المحل لشركة الشحن، فبيتسجل كمصروف تحت بند "التوصيل" وكمان كفاتورة على حساب شركة الشحن في صفحة الموردين
  if(status==='تم التسليم' && o.status!=='تم التسليم' && o.shipping && o.shipping.paidBy==='العميل' && o.shipping.shippingCost>0 && !o.shipping._deliveryExpenseId){
    const today = new Date().toISOString().slice(0,10);
    const expenseId = uid('e_');
    DB.expenses.push({id:expenseId, type:'التوصيل', note:`مصاريف شحن طلب ${o.id} — ${o.shipping.company} (محصّلة من العميل)`, amount:o.shipping.shippingCost, date:today});
    const supplierId = findOrCreateSupplierByName(o.shipping.company);
    const supplierTxId = uid('slt_');
    DB.supplierLedger.push({id:supplierTxId, supplierId, type:'invoice', amount:o.shipping.shippingCost, note:`مصاريف شحن طلب ${o.id} (محصّلة من العميل)`, date:new Date().toISOString()});
    o.shipping._deliveryExpenseId = expenseId;
    o.shipping._deliverySupplierTxId = supplierTxId;
  }
  o.status = status;
  saveOrderRemote(o);
  saveDB(); render(); toast('تم تحديث حالة الطلب','ok');
}

  const sendWa = document.getElementById('sh_sendwa').checked;

  let expenseId = null;
  if(paidBy==='المحل' && shippingCost>0){
    expenseId = uid('e_');
    DB.expenses.push({id:expenseId, type:'شحن', note:`شحن طلب ${o.id} — ${company}`, amount:shippingCost, date: shipDate || new Date().toISOString().slice(0,10)});
  }

  o.shipping = {company, trackingNumber, shipDate, eta, shippingCost, codAmount, paidBy, repPhone, notes, _expenseId:expenseId};
  o.status = 'تم الشحن';
  saveOrderRemote(o);
  saveDB();

  if(sendWa && o.customerPhone){
    const s = DB.settings;
    const custPhone = o.customerPhone.replace(/[^0-9]/g,'');
    const waPhone = custPhone.startsWith('20') ? custPhone : ('20' + custPhone.replace(/^0/,''));
    const trackLine = trackingNumber? `%0Aرقم بوليصة الشحن: ${trackingNumber} (${company})` : `%0Aتم الشحن مع: ${company}`;
    const etaLine = eta? `%0Aتاريخ الوصول المتوقع: ${new Date(eta).toLocaleDateString('ar-EG')}` : '';
    const codLine = codAmount>0? `%0Aالمبلغ المطلوب عند الاستلام: ${money(codAmount)}` : '';
    const msg = `أهلاً ${o.customerName} 👋%0Aتم شحن طلبك رقم ${o.id} ✅${trackLine}${etaLine}${codLine}%0Aشكراً لتسوقك من ${s.shopName} 👟`;
    window.open(`https://wa.me/${waPhone}?text=${msg}`, '_blank');
  }
  closeSheet(); render(); toast('تم تحديث حالة الشحن ✓','ok');
}

function supplierBalance(sid){
  return DB.supplierLedger.filter(t=>t.supplierId===sid).reduce((s,t)=> s + (t.type==='invoice'? t.amount : -t.amount), 0);
}
function findOrCreateSupplierByName(name){
  let s = DB.suppliers.find(x=> x.name === name);
  if(!s){ s = {id:uid('sup_'), name, phone:'', notes:'شركة شحن (مضافة تلقائياً من الطلبات)'}; DB.suppliers.push(s); }
  return s.id;
}
function distributorBalance(did){
  return DB.distributorLedger.filter(t=>t.distributorId===did).reduce((s,t)=> s + (t.type==='delivery'? t.amount : -t.amount), 0);
}
function daysUntil(dateStr){
  if(!dateStr) return null;
  const d = new Date(dateStr); d.setHours(0,0,0,0);
  const today = new Date(); today.setHours(0,0,0,0);
  return Math.round((d-today)/(1000*60*60*24));
}
function dueBadge(dateStr, paid){
  if(paid) return `<span class="status-pill shipped">تم الدفع</span>`;
  const dl = daysUntil(dateStr);
  if(dl===null) return '';
  if(dl<0) return `<span class="status-pill cancelled">متأخر ${Math.abs(dl)} يوم</span>`;
  if(dl<=3) return `<span class="status-pill prep">مستحق خلال ${dl} يوم</span>`;
  return `<span class="status-pill shipped">مستحق ${new Date(dateStr).toLocaleDateString('ar-EG')}</span>`;
}

function savePurchaseOrder(){
  const d = window._poDraft;
  if(d.items.length===0){ toast('أضف صنف واحد على الأقل','err'); return; }
  for(const it of d.items){
    if(!it.productId || !it.color || !it.size || !it.qty || it.qty<=0){ toast('استكمل بيانات كل الأصناف (منتج/لون/مقاس/كمية)','err'); return; }
  }
  if(!d.supplierId){ toast('اختر مورد','err'); return; }
  let newSupplierName = '';
  let newSupplierPhone = '';
  if(d.supplierId==='__new__'){
    const elName = document.getElementById('poNewSupplierName');
    const elPhone = document.getElementById('poNewSupplierPhone');
    newSupplierName = ((elName? elName.value : d.newSupplierName)||'').trim();
    newSupplierPhone = ((elPhone? elPhone.value : d.newSupplierPhone)||'').trim();
    if(!newSupplierName){ toast('اكتب اسم المورد الجديد','err'); return; }
  }

  const total = d.items.reduce((s,it)=> s + it.qty*it.unitCost, 0);
  const down = Math.min(Math.max(0, d.downPayment||0), total);
  const remaining = Math.max(0, total - down);
  const count = Math.max(1, d.installmentsCount||1);

  if(remaining>0 && !d.firstDueDate){ toast('اختر تاريخ أول قسط','err'); return; }

  let supplierId = d.supplierId;
  if(supplierId==='__new__'){
    const newSup = {id:uid('sup_'), name:newSupplierName, phone:newSupplierPhone, notes:'', status:'قيد التسجيل'};
    DB.suppliers.push(newSup);
    supplierId = newSup.id;
  }

  const poId = uid('po_');
  const today = new Date().toISOString().slice(0,10);

  DB.supplierLedger.push({id:uid('slt_'), supplierId, type:'invoice', amount:total, note:'أمر شراء '+poId, date:new Date().toISOString()});
  if(down>0){
    DB.supplierLedger.push({id:uid('slt_'), supplierId, type:'payment', amount:down, note:'دفعة مقدمة على أمر شراء '+poId, date:new Date().toISOString()});
  }
  const installmentIds = [];
  if(remaining>0){
    const perRounded = Math.round((remaining/count)*100)/100;
    const base = new Date(d.firstDueDate);
    for(let i=0;i<count;i++){
      const dt = new Date(base); dt.setMonth(dt.getMonth()+i);
      const instId = uid('sin_');
      const amt = i===count-1? Math.round((remaining - perRounded*(count-1))*100)/100 : perRounded;
      DB.supplierInstallments.push({id:instId, supplierId, amount:amt, dueDate:dt.toISOString().slice(0,10), note:'قسط أمر شراء '+poId, paid:false});
      installmentIds.push(instId);
    }
  }

  DB.purchaseOrders.push({
    id:poId, supplierId, date:today,
    items: d.items.map(it=>({productId:it.productId, name:(DB.products.find(p=>p.id===it.productId)||{}).name||'', size:it.size, color:it.color, qty:it.qty, unitCost:it.unitCost})),
    totalAmount:total, downPayment:down, remainingAmount:remaining,
    installmentIds, stockReceived:false
  });

  saveDB(); toast('تم حفظ أمر الشراء ✓','ok'); closeSheet();
  resetPODraft();
  window._supDist.tab = 'purchaseOrders';
  render();
}

/* ================= ADMIN ANALYSIS (تحليل المبيعات: فرص وتهديدات) ================= */
function analysisData(from, to){
  const inRange = d=> d.slice(0,10)>=from && d.slice(0,10)<=to;
  const orders = DB.orders.filter(o=> inRange(o.date));
  const returns = DB.returns.filter(r=> inRange(r.date));

  // مبيعات لكل منتج
  const prodStats = {};
  orders.forEach(o=> o.items.forEach(i=>{
    if(!prodStats[i.productId]) prodStats[i.productId] = {productId:i.productId, name:i.name, qty:0, revenue:0};
    prodStats[i.productId].qty += i.qty;
    prodStats[i.productId].revenue += i.price*i.qty;
  }));
  const maxQty = Math.max(1, ...Object.values(prodStats).map(s=>s.qty));
  const topSelling = Object.values(prodStats).sort((a,b)=> b.qty-a.qty).slice(0,8)
    .map(s=> ({...s, pct: Math.round(s.qty/maxQty*100)}));

  // مرتجعات لكل منتج + نسبة الإرجاع من المباع
  const retStats = {};
  returns.forEach(r=>{
    if(!retStats[r.productId]) retStats[r.productId] = {productId:r.productId, name:r.productName, qty:0};
    retStats[r.productId].qty += r.qty;
  });
  const topReturns = Object.values(retStats).map(r=>{
    const sold = (prodStats[r.productId]? prodStats[r.productId].qty:0) + r.qty; // إجمالي اللي خرج فعليًا قبل الإرجاع
    const rate = sold>0 ? Math.round(r.qty/sold*100) : 100;
    return {...r, sold, rate};
  }).sort((a,b)=> b.qty-a.qty || b.rate-a.rate).slice(0,8);

  // الأعلى ربحية
  const profitStats = Object.values(prodStats).map(s=>{
    const p = DB.products.find(pp=>pp.id===s.productId);
    const cost = p? (p.cost||0):0;
    const profit = s.revenue - cost*s.qty;
    const margin = s.revenue>0 ? Math.round(profit/s.revenue*100) : 0;
    return {...s, profit, margin};
  }).sort((a,b)=> b.profit-a.profit).slice(0,6);

  // بضاعة راكدة: موجودة بالمخزون لكن مبيعاتها ضعيفة/معدومة في الفترة
  const stockMap = {};
  DB.inventory.forEach(inv=>{ stockMap[inv.productId] = (stockMap[inv.productId]||0) + (inv.qty||0); });
  const slowMovers = DB.products.filter(p=> (stockMap[p.id]||0) > 0).map(p=>{
    const sold = prodStats[p.id]? prodStats[p.id].qty : 0;
    return {productId:p.id, name:p.name, stock: stockMap[p.id]||0, sold};
  }).sort((a,b)=> a.sold - b.sold || b.stock-a.stock).slice(0,6);

  // المبيعات حسب الماركة
  const brandMap = {};
  orders.forEach(o=> o.items.forEach(i=>{
    const p = DB.products.find(pp=>pp.id===i.productId);
    const brand = (p&&p.brand) ? p.brand : 'غير مصنف';
    brandMap[brand] = (brandMap[brand]||0) + i.price*i.qty;
  }));
  const maxBrand = Math.max(1, ...Object.values(brandMap));
  const byBrand = Object.entries(brandMap).sort((a,b)=> b[1]-a[1]).slice(0,6).map(([name,val])=> ({name, val, pct: Math.round(val/maxBrand*100)}));

  // أفضل العملاء
  const custMap = {};
  orders.forEach(o=>{
    if(!custMap[o.customerId]) custMap[o.customerId] = {name:o.customerName, phone:o.customerPhone, total:0, count:0};
    custMap[o.customerId].total += o.total; custMap[o.customerId].count += 1;
  });
  const topCustomers = Object.values(custMap).sort((a,b)=> b.total-a.total).slice(0,6);

  const totalRevenue = orders.reduce((s,o)=>s+o.total,0);
  const totalQtySold = Object.values(prodStats).reduce((s,x)=>s+x.qty,0);
  const totalReturnsQty = returns.reduce((s,r)=>s+r.qty,0);
  const returnRate = (totalQtySold+totalReturnsQty)>0 ? Math.round(totalReturnsQty/(totalQtySold+totalReturnsQty)*100) : 0;

  return {topSelling, topReturns, profitStats, slowMovers, byBrand, topCustomers, totalRevenue, totalQtySold, totalReturnsQty, returnRate, ordersCount:orders.length};
}

function deleteReturnLog(rid){
  const r = DB.returns.find(x=>x.id===rid); if(!r) return;
  if(!confirm('حذف هذا المرتجع سيتراجع عن حركة المخزون المرتبطة به. هل أنت متأكد؟')) return;
  // نتراجع عن حركة المخزون: نخصم اللي كان اترجع للمخزون الأصلي، ونرجّع اللي كان اتخصم من المقاس الجديد (لو تبديل)
  adjInv(r.productId, r.size, r.color, -r.qty);
  if(r.action==='exchange' && r.newSize) adjInv(r.productId, r.newSize, r.color, r.qty);
  DB.returns = DB.returns.filter(x=>x.id!==rid);
  saveDB(); render(); toast('تم حذف المرتجع والتراجع عن حركة المخزون','ok');
}
function returnedQtyForOrderItem(oid, idx){
  return DB.returns.filter(r=> r.orderId===oid && r.itemIndex===idx).reduce((s,r)=>s+r.qty,0);
}
function renderReturnItemArea(oid){
  const area = document.getElementById('retItemArea');
  if(!oid){ area.innerHTML=''; return; }
  const o = DB.orders.find(x=>x.id===oid); if(!o){ area.innerHTML=''; return; }
  const remainingFor = idx=> o.items[idx].qty - returnedQtyForOrderItem(oid, idx);
  area.innerHTML = `
  <label class="fl">الصنف</label>
  <select class="field" id="retItemSelect">
    ${o.items.map((i,idx)=>{ const rem = remainingFor(idx); return `<option value="${idx}" ${rem<=0?'disabled':''}>${i.name} — مقاس ${i.size} — ${i.color} — متاح للإرجاع ${rem} من ${i.qty}</option>`; }).join('')}
  </select>
  <label class="fl">الإجراء</label>
  <select class="field" id="retAction">
    <option value="return">إرجاع (استرداد للمخزون)</option>
    <option value="exchange">تبديل مقاس</option>
  </select>
  <div id="retNewSizeWrap" style="display:none;"><label class="fl">المقاس الجديد</label><input class="field" id="retNewSize" placeholder="مثال 42"></div>
  <label class="fl">الكمية (المتاح: <span id="retRemainingHint">${remainingFor(0)}</span>)</label><input class="field" type="number" id="retQty" value="1" min="1" max="${remainingFor(0)}">
  <label class="fl">السبب (اختياري)</label><input class="field" id="retReason">
  <button class="big-btn sm" id="btnProcessReturn" data-oid="${oid}">تنفيذ العملية</button>
  `;
  document.getElementById('retAction').addEventListener('change', e=>{
    document.getElementById('retNewSizeWrap').style.display = e.target.value==='exchange' ? 'block':'none';
  });
  document.getElementById('retItemSelect').addEventListener('change', e=>{
    const rem = remainingFor(Number(e.target.value));
    document.getElementById('retRemainingHint').textContent = rem;
    const qtyInput = document.getElementById('retQty');
    qtyInput.max = rem; qtyInput.value = Math.min(Number(qtyInput.value)||1, rem||1);
  });
}
function processReturn(oid){
  const o = DB.orders.find(x=>x.id===oid); if(!o) return;
  const idx = Number(document.getElementById('retItemSelect').value);
  const item = o.items[idx];
  const action = document.getElementById('retAction').value;
  const qty = Math.max(1, Number(document.getElementById('retQty').value)||1);
  const reason = document.getElementById('retReason').value.trim();
  const remaining = item.qty - returnedQtyForOrderItem(oid, idx);
  if(qty > remaining){ toast(`الكمية المتاحة للإرجاع من هذا الصنف هي ${remaining} فقط`,'err'); return; }
  let newSize = '';
  if(action==='exchange'){
    newSize = document.getElementById('retNewSize').value.trim();
    if(!newSize){ toast('من فضلك أدخل المقاس الجديد','err'); return; }
  }
  // كل شيء سليم — نفّذ حركة المخزون الآن
  adjInv(item.productId, item.size, item.color, qty); // إرجاع الصنف الأصلي للمخزون
  if(action==='exchange'){
    adjInv(item.productId, newSize, item.color, -qty); // خصم المقاس الجديد
  }
  DB.returns.push({id:uid('r_'), orderId:oid, itemIndex:idx, productId:item.productId, productName:item.name, size:item.size, color:item.color, qty, reason, action, newSize, date:new Date().toISOString()});
  saveDB(); toast('تم تنفيذ العملية وتحديث المخزون ✓','ok'); render();
}

/* ================= مسح كل بيانات المحل نهائيًا ================= */
async function wipeShopData(){
  if(!fbUser){ toast('لازم تكون مسجّل دخول','err'); return; }
  const typed = prompt('العملية دي هتمسح كل المنتجات والمخزون والطلبات والعملاء والمصروفات والمرتجعات وصور المنتجات نهائيًا ومش هترجع تاني.\n\nاكتب "مسح" بالظبط عشان تأكد:');
  if(typed !== 'مسح'){ toast('تم الإلغاء','err'); return; }

  const btn = document.getElementById('btnWipeShopData');
  if(btn){ btn.disabled = true; btn.textContent = '⏳ جارٍ المسح...'; }
  try{
    // 1) امسح كل الطلبات من الـ subcollection
    const ordersSnap = await ordersRef(fbUser.uid).get();
    const orderDocs = ordersSnap.docs;
    for(let i=0;i<orderDocs.length;i+=400){
      const batch = fbStore.batch();
      orderDocs.slice(i,i+400).forEach(d=> batch.delete(d.ref));
      await batch.commit();
    }
    // 2) امسح كل صور المنتجات من Storage (مجلد كل منتج فيه صوره)
    try{
      const productsFolder = fbStorage.ref(`shops/${fbUser.uid}/products`);
      const listRes = await productsFolder.listAll();
      await Promise.all(listRes.prefixes.map(async folderRef=>{
        const sub = await folderRef.listAll();
        await Promise.all(sub.items.map(item=> item.delete().catch(()=>{})));
      }));
      await Promise.all(listRes.items.map(item=> item.delete().catch(()=>{})));
    }catch(err){ console.warn('Storage cleanup partial failure (متوقع لو Storage مش مفعّل):', err); }

    // 3) صفّر باقي بيانات المحل (المنتجات/المخزون/العملاء/المصروفات/المرتجعات/السلة) واحفظها
    DB.products = [];
    DB.inventory = [];
    DB.customers = [];
    DB.orders = [];
    DB.expenses = [];
    DB.returns = [];
    DB.cart = [];
    saveDB();
    toast('تم مسح كل بيانات المحل ✓','ok');
    render();
  }catch(err){
    console.error('wipeShopData failed', err);
    toast('حصل خطأ أثناء المسح، جرب تاني','err');
    if(btn){ btn.disabled = false; btn.textContent = '🗑️ مسح كل بيانات المحل'; }
  }
}

/* ================= EXCEL EXPORT / BACKUP ================= */
function exportExcel(){
  const wb = XLSX.utils.book_new();
  const productsSheet = DB.products.map(p=>({ProductID:p.id, Name:p.name, Brand:p.brand, Gender:p.gender, Material:p.material, Price:p.price, Cost:p.cost, Barcode:p.barcode, Colors:p.colors.join(','), Sizes:p.sizes.join(','), Image:p.images[0]}));
  const inventorySheet = DB.inventory.map(i=>({InventoryID:i.id, ProductID:i.productId, Size:i.size, Color:i.color, Qty:i.qty}));
  const customersSheet = DB.customers.map(c=>({CustomerID:c.id, Name:c.name, Phone:c.phone, Address:c.address, Notes:c.notes||''}));
  const ordersSheet = DB.orders.map(o=>({OrderID:o.id, Type:o.type, CustomerID:o.customerId||'', CustomerName:o.customerName, Phone:o.customerPhone||'', Address:o.address||'', Total:o.total, Status:o.status, Date:o.date, PaymentMethod:o.paymentMethod}));
  const orderDetailsSheet = [];
  DB.orders.forEach(o=> o.items.forEach((i,idx)=> orderDetailsSheet.push({OrderDetailID:o.id+'-'+idx, OrderID:o.id, ProductID:i.productId, ProductName:i.name, Size:i.size, Color:i.color, Qty:i.qty, Price:i.price, LineTotal:i.price*i.qty})));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(productsSheet), 'Products');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(inventorySheet), 'Inventory');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(customersSheet), 'Customers');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(ordersSheet), 'Orders');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(orderDetailsSheet), 'Order Details');
  XLSX.writeFile(wb, 'kotshiyat-data.xlsx');
  toast('تم تصدير الملف ✓','ok');
}

<script>
var DATA = /*__CATALOG_DATA__*/;
var CART = [];
var STATE = { pid:null, color:null, size:null, qty:1, imgIdx:0 };

function esc(s){
  return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function money(n){ return (Math.round(n*100)/100).toLocaleString('ar-EG') + ' ج.م'; }
function toast(msg, kind){
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (kind? (' '+kind) : '');
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(function(){ t.className = 'toast'; }, 2400);
}
function openOverlay(html){
  document.getElementById('sheet').innerHTML = '<button class="sheet-close" id="btnSheetClose">✕</button><div class="sheet-handle"></div>' + html;
  document.getElementById('overlay').classList.add('open');
  document.getElementById('btnSheetClose').addEventListener('click', closeOverlay);
}
function closeOverlay(){ document.getElementById('overlay').classList.remove('open'); }
document.getElementById('overlay').addEventListener('click', function(e){ if(e.target.id==='overlay') closeOverlay(); });

function productStock(p, size, color){
  var key = size + '|' + color;
  return p.stock && p.stock[key] ? p.stock[key] : 0;
}
function productTotalStock(p){
  var total = 0;
  if(p.stock){ for(var k in p.stock){ total += p.stock[k]; } }
  return total;
}
function productColorsInStock(p){
  var set = {};
  p.colors.forEach(function(c){
    p.sizes.forEach(function(s){ if(productStock(p,s,c) > 0) set[c] = true; });
  });
  return Object.keys(set);
}
function productSizesInStockForColor(p, color){
  return p.sizes.filter(function(s){ return productStock(p, s, color) > 0; });
}

function renderProducts(){
  var q = (document.getElementById('searchInput').value || '').trim().toLowerCase();
  var grid = document.getElementById('productGrid');
  var list = DATA.products.filter(function(p){
    if(!q) return true;
    return (p.name||'').toLowerCase().indexOf(q) > -1 || (p.brand||'').toLowerCase().indexOf(q) > -1;
  });
  if(list.length === 0){
    grid.innerHTML = '<div class="empty-state" style="grid-column:1/-1;"><div class="ic">🔎</div>لا توجد نتائج</div>';
    return;
  }
  var html = '';
  list.forEach(function(p){
    var stock = productTotalStock(p);
    var img = (p.images && p.images[0]) || '';
    html += '<div class="pcard" id="p-' + esc(p.id) + '" data-pid="' + esc(p.id) + '">' +
      '<img src="' + esc(img) + '" loading="lazy">' +
      '<div class="body">' +
        '<div class="name">' + esc(p.name) + '</div>' +
        '<div class="brand">' + esc(p.brand||'') + '</div>' +
        '<div class="price">' + money(p.price) + '</div>' +
        (stock<=0 ? '<div class="oos">غير متوفر حالياً</div>' : '') +
      '</div>' +
    '</div>';
  });
  grid.innerHTML = html;
  var cards = grid.querySelectorAll('[data-pid]');
  for(var i=0;i<cards.length;i++){
    cards[i].addEventListener('click', (function(pid){ return function(){ openProduct(pid); }; })(cards[i].getAttribute('data-pid')));
  }
}

function openProduct(pid){
  var p = DATA.products.filter(function(x){ return x.id===pid; })[0];
  if(!p) return;
  var colors = productColorsInStock(p);
  STATE = { pid:pid, color: colors[0] || (p.colors[0]||''), size:null, qty:1, imgIdx:0 };
  if(STATE.color){
    var sizes = productSizesInStockForColor(p, STATE.color);
    STATE.size = sizes[0] || null;
  }
  openOverlay(productSheetHTML(p));
  bindProductSheet(p);
}

function productSheetHTML(p){
  var img = (p.images && p.images[STATE.imgIdx]) || (p.images && p.images[0]) || '';
  var colors = productColorsInStock(p);
  var sizes = STATE.color ? productSizesInStockForColor(p, STATE.color) : [];
  var stock = STATE.color && STATE.size ? productStock(p, STATE.size, STATE.color) : 0;
  var html = '';
  html += '<img class="pd-img" src="' + esc(img) + '">';
  if(p.images && p.images.length>1){
    html += '<div class="opt-row">';
    p.images.forEach(function(im,idx){
      html += '<button class="opt-pill thumb-pill ' + (idx===STATE.imgIdx?'sel':'') + '" data-img-idx="' + idx + '">صورة ' + (idx+1) + '</button>';
    });
    html += '</div>';
  }
  html += '<h3>' + esc(p.name) + '</h3>';
  html += '<div style="color:var(--muted); font-size:12.5px;">' + esc(p.brand||'') + (p.gender? ' · '+esc(p.gender) : '') + '</div>';
  html += '<div class="pd-price">' + money(p.price) + '</div>';

  html += '<div class="fl">اللون</div><div class="opt-row">';
  if(colors.length===0){ html += '<span style="font-size:12.5px; color:var(--danger);">غير متوفر حالياً بأي لون</span>'; }
  colors.forEach(function(c){
    html += '<button class="opt-pill color-pill ' + (STATE.color===c?'sel':'') + '" data-color="' + esc(c) + '">' + esc(c) + '</button>';
  });
  html += '</div>';

  html += '<div class="fl">المقاس</div><div class="opt-row">';
  if(sizes.length===0){ html += '<span style="font-size:12.5px; color:var(--danger);">اختر لون متاح أولاً</span>'; }
  sizes.forEach(function(s){
    html += '<button class="opt-pill size-pill ' + (STATE.size===s?'sel':'') + '" data-size="' + esc(s) + '">' + esc(s) + '</button>';
  });
  html += '</div>';

  html += '<div class="qty-stepper">' +
    '<button id="btnQtyMinus">−</button>' +
    '<span id="qtyVal" style="font-family:Cairo; font-weight:800; font-size:16px;">' + STATE.qty + '</span>' +
    '<button id="btnQtyPlus">+</button>' +
    '<span style="color:var(--muted); font-size:11.5px;">(المتاح: ' + stock + ')</span>' +
  '</div>';

  html += '<button class="big-btn" id="btnAddCart" ' + (stock<=0?'disabled':'') + '>🛒 إضافة للسلة</button>';
  return html;
}

function refreshProductSheet(){
  var p = DATA.products.filter(function(x){ return x.id===STATE.pid; })[0];
  if(!p) return;
  var scroll = document.getElementById('sheet').scrollTop;
  document.getElementById('sheet').innerHTML = '<button class="sheet-close" id="btnSheetClose">✕</button><div class="sheet-handle"></div>' + productSheetHTML(p);
  document.getElementById('btnSheetClose').addEventListener('click', closeOverlay);
  bindProductSheet(p);
  document.getElementById('sheet').scrollTop = scroll;
}

function bindProductSheet(p){
  var sheet = document.getElementById('sheet');
  var colorPills = sheet.querySelectorAll('.color-pill');
  for(var i=0;i<colorPills.length;i++){
    colorPills[i].addEventListener('click', (function(el){ return function(){
      STATE.color = el.getAttribute('data-color');
      var sizes = productSizesInStockForColor(p, STATE.color);
      STATE.size = sizes[0] || null;
      STATE.qty = 1;
      refreshProductSheet();
    }; })(colorPills[i]));
  }
  var sizePills = sheet.querySelectorAll('.size-pill');
  for(var j=0;j<sizePills.length;j++){
    sizePills[j].addEventListener('click', (function(el){ return function(){
      STATE.size = el.getAttribute('data-size');
      STATE.qty = 1;
      refreshProductSheet();
    }; })(sizePills[j]));
  }
  var thumbPills = sheet.querySelectorAll('.thumb-pill');
  for(var k=0;k<thumbPills.length;k++){
    thumbPills[k].addEventListener('click', (function(el){ return function(){
      STATE.imgIdx = Number(el.getAttribute('data-img-idx'));
      refreshProductSheet();
    }; })(thumbPills[k]));
  }
  var btnMinus = document.getElementById('btnQtyMinus');
  if(btnMinus) btnMinus.addEventListener('click', function(){
    STATE.qty = Math.max(1, STATE.qty-1); refreshProductSheet();
  });
  var btnPlus = document.getElementById('btnQtyPlus');
  if(btnPlus) btnPlus.addEventListener('click', function(){
    var stock = STATE.color && STATE.size ? productStock(p, STATE.size, STATE.color) : 0;
    STATE.qty = Math.min(stock||1, STATE.qty+1); refreshProductSheet();
  });
  var btnAdd = document.getElementById('btnAddCart');
  if(btnAdd) btnAdd.addEventListener('click', function(){
    addToCart(p);
  });
}

function addToCart(p){
  if(!STATE.color || !STATE.size){ toast('اختر اللون والمقاس', 'err'); return; }
  var stock = productStock(p, STATE.size, STATE.color);
  if(stock<=0){ toast('غير متوفر بهذا الاختيار', 'err'); return; }
  var existing = CART.filter(function(i){ return i.productId===p.id && i.size===STATE.size && i.color===STATE.color; })[0];
  if(existing){ existing.qty = Math.min(existing.qty + STATE.qty, stock); }
  else {
    CART.push({ productId:p.id, name:p.name, size:STATE.size, color:STATE.color, qty:STATE.qty, price:p.price, image:(p.images&&p.images[0])||'' });
  }
  updateCartBadge();
  toast('تمت الإضافة للسلة ✓', 'ok');
  closeOverlay();
}

function updateCartBadge(){
  var count = CART.reduce(function(s,i){ return s+i.qty; }, 0);
  var badge = document.getElementById('cartBadge');
  if(count>0){ badge.style.display='flex'; badge.textContent = count; }
  else { badge.style.display='none'; }
}

function openCart(){
  openOverlay(cartHTML());
  bindCartEvents();
}
function cartHTML(){
  if(CART.length===0){
    return '<h3>سلة المشتريات</h3><div class="empty-state"><div class="ic">🛒</div>السلة فارغة</div>';
  }
  var total = CART.reduce(function(s,i){ return s+i.price*i.qty; }, 0);
  var html = '<h3>سلة المشتريات</h3>';
  CART.forEach(function(i,idx){
    html += '<div class="cart-item">' +
      '<img src="' + esc(i.image) + '">' +
      '<div class="info">' +
        '<div class="n">' + esc(i.name) + '</div>' +
        '<div class="m">مقاس ' + esc(i.size) + ' · ' + esc(i.color) + '</div>' +
        '<div class="ctrl">' +
          '<button class="cart-qty-minus" data-idx="' + idx + '">−</button>' +
          '<span style="font-size:12.5px; font-weight:700;">' + i.qty + '</span>' +
          '<button class="cart-qty-plus" data-idx="' + idx + '">+</button>' +
        '</div>' +
      '</div>' +
      '<div class="price-col">' +
        '<div style="font-family:Cairo; font-weight:800; font-size:13px;">' + money(i.price*i.qty) + '</div>' +
        '<button class="del cart-del" data-idx="' + idx + '">حذف</button>' +
      '</div>' +
    '</div>';
  });
  html += '<div class="summary-row total"><span>الإجمالي</span><span>' + money(total) + '</span></div>';
  html += '<button class="big-btn green" id="btnGoCheckout">متابعة الطلب</button>';
  return html;
}
function bindCartEvents(){
  var sheet = document.getElementById('sheet');
  var minus = sheet.querySelectorAll('.cart-qty-minus');
  for(var i=0;i<minus.length;i++){
    minus[i].addEventListener('click', (function(el){ return function(){
      var idx = Number(el.getAttribute('data-idx'));
      CART[idx].qty = Math.max(1, CART[idx].qty-1);
      updateCartBadge(); openOverlay(cartHTML()); bindCartEvents();
    }; })(minus[i]));
  }
  var plus = sheet.querySelectorAll('.cart-qty-plus');
  for(var j=0;j<plus.length;j++){
    plus[j].addEventListener('click', (function(el){ return function(){
      var idx = Number(el.getAttribute('data-idx'));
      var it = CART[idx];
      var p = DATA.products.filter(function(x){ return x.id===it.productId; })[0];
      var stock = p ? productStock(p, it.size, it.color) : 999;
      it.qty = Math.min(stock||it.qty, it.qty+1);
      updateCartBadge(); openOverlay(cartHTML()); bindCartEvents();
    }; })(plus[j]));
  }
  var dels = sheet.querySelectorAll('.cart-del');
  for(var k=0;k<dels.length;k++){
    dels[k].addEventListener('click', (function(el){ return function(){
      var idx = Number(el.getAttribute('data-idx'));
      CART.splice(idx,1);
      updateCartBadge(); openOverlay(cartHTML()); bindCartEvents();
    }; })(dels[k]));
  }
  var goCheckout = document.getElementById('btnGoCheckout');
  if(goCheckout) goCheckout.addEventListener('click', openCheckout);
}

function openCheckout(){
  var html = '<h3>بيانات التوصيل</h3>' +
    '<label class="fl">الاسم بالكامل</label><input class="field" id="custName">' +
    '<label class="fl">رقم الموبايل</label><input class="field" id="custPhone" placeholder="01xxxxxxxxx">' +
    '<label class="fl">العنوان</label><input class="field" id="custAddress" placeholder="المحافظة، المنطقة، الشارع">' +
    '<button class="big-btn green" id="btnSubmitOrder">✅ تأكيد الطلب</button>';
  openOverlay(html);
  document.getElementById('btnSubmitOrder').addEventListener('click', submitOrder);
}

function submitOrder(){
  var name = document.getElementById('custName').value.trim();
  var phone = document.getElementById('custPhone').value.trim();
  var address = document.getElementById('custAddress').value.trim();
  if(!name || !phone){ toast('من فضلك أدخل الاسم ورقم الموبايل', 'err'); return; }
  if(CART.length===0){ toast('السلة فارغة', 'err'); return; }

  var btn = document.getElementById('btnSubmitOrder');
  if(btn){ btn.disabled = true; btn.textContent = 'جاري الإرسال...'; }

  var total = CART.reduce(function(s,i){ return s+i.price*i.qty; }, 0);
  var orderId = 'PUB-' + Date.now().toString().slice(-6) + Math.random().toString(36).slice(2,5).toUpperCase();
  var order = {
    id: orderId, type:'online', source:'public_catalog', customerId:null,
    customerName:name, customerPhone:phone, address:address,
    items: CART.map(function(i){ return {productId:i.productId, name:i.name, size:i.size, color:i.color, qty:i.qty, price:i.price}; }),
    total: total, status:'قيد التجهيز', date: new Date().toISOString(), paymentMethod:'كاش عند الاستلام',
    _stockConfirmed:false
  };

function buildCatalogData(){
  const products = DB.products.map(p=>{
    const stock = {};
    DB.inventory.filter(i=>i.productId===p.id).forEach(i=>{ stock[i.size+'|'+i.color] = i.qty; });
    return {id:p.id, name:p.name, brand:p.brand, gender:p.gender, price:p.price, images:p.images, colors:p.colors, sizes:p.sizes, stock};
  });
  return {
    shopId: fbUser.uid, shopName: DB.settings.shopName, shopLogo: DB.settings.shopLogo || '👟',
    whatsapp: DB.settings.whatsapp, exportedAt: new Date().toISOString(), firebaseConfig: firebaseConfig, products: products
  };
}
function catalogFilenameSafe(s){ return (s||'').replace(/[^a-zA-Z0-9\u0600-\u06FF_-]+/g,'_').slice(0,40) || 'catalog'; }
function productTotalStockMain(p){
  return DB.inventory.filter(i=>i.productId===p.id).reduce((sum,i)=> sum + (Number(i.qty)||0), 0);
}
function buildFacebookFeedXml(){
  const baseUrl = (DB.settings.publicCatalogUrl||'').trim();
  const shopName = escapeXml(DB.settings.shopName || 'المتجر');
  const items = DB.products.map(p=>{
    const stock = productTotalStockMain(p);
    const link = baseUrl ? (baseUrl + '#p-' + encodeURIComponent(p.id)) : '';
    const images = (p.images||[]).filter(Boolean);
    const mainImage = images[0] || '';
    const extraImages = images.slice(1,10).map(img=>`<g:additional_image_link>${escapeXml(img)}</g:additional_image_link>`).join('\n      ');
    const priceNum = (Math.round((Number(p.price)||0)*100)/100).toFixed(2);
    return `    <item>
      <g:id>${escapeXml(p.id)}</g:id>
      <g:title>${escapeXml(p.name||'منتج')}</g:title>
      <g:description>${escapeXml((p.brand? p.brand+' - ':'') + (p.material||p.name||'منتج'))}</g:description>
      <g:link>${escapeXml(link)}</g:link>
      <g:image_link>${escapeXml(mainImage)}</g:image_link>
      ${extraImages}
      <g:availability>${stock>0?'in stock':'out of stock'}</g:availability>
      <g:price>${priceNum} EGP</g:price>
      <g:brand>${escapeXml(p.brand || shopName)}</g:brand>
      <g:condition>new</g:condition>
    </item>`;
  }).join('\n');
  return `<?xml version="1.0" encoding="UTF-8"?>
<rss version="2.0" xmlns:g="http://base.google.com/ns/1.0">
  <channel>
    <title>${shopName}</title>
    <link>${escapeXml(baseUrl||'')}</link>
    <description>كتالوج منتجات ${shopName}</description>
${items}
  </channel>
</rss>`;
}
function downloadFacebookFeed(){

  if(!(DB.settings.publicCatalogUrl||'').trim()){ toast('حط رابط صفحة الكتالوج العام في الخانة فوق واحفظ الإعدادات الأول','err'); return; }
