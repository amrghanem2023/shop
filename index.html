/* نسخة احتياطية تلقائية يومية (مرة واحدة كل يوم لكل جهاز، بدون إزعاج المستخدم) */
const AUTO_BACKUP_KEY = 'kotshiyat_lastAutoBackup';
function maybeAutoBackup(){
  try{
    const today = new Date().toISOString().slice(0,10); // YYYY-MM-DD
    const last = localStorage.getItem(AUTO_BACKUP_KEY);
    if(last === today) return; // اتعمل النهاردة بالفعل
    if(!DB || !Array.isArray(DB.products)) return; // البيانات لسه ماتحمّلتش كامل
    const blob = new Blob([JSON.stringify(DB,null,2)], {type:'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'kotshiyat-backup-auto-' + today + '.json';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    localStorage.setItem(AUTO_BACKUP_KEY, today);
  }catch(e){ console.error('auto backup failed', e); }
}
function restoreJson(file){
  const reader = new FileReader();
  reader.onload = e=>{
    try{ const data = JSON.parse(e.target.result); DB = data; saveDB(); toast('تم استرجاع النسخة الاحتياطية ✓','ok'); render(); }
    catch(err){ toast('ملف غير صالح','err'); }
  };
  reader.readAsText(file);
}
function importProductsExcel(file){
  const reader = new FileReader();
  reader.onload = e=>{
    try{
      const wb = XLSX.read(e.target.result, {type:'binary'});
      const sheet = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(sheet);
      let added = 0;
      rows.forEach(r=>{
        const colors = String(r.colors||r.Colors||'').split(',').map(s=>s.trim()).filter(Boolean);
        const sizes = String(r.sizes||r.Sizes||'').split(',').map(s=>s.trim()).filter(Boolean);
        if(!r.name && !r.Name) return;
        const pname = r.name||r.Name;
        const np = {id:uid('p_'), name:pname, brand:r.brand||r.Brand||'', gender:r.gender||r.Gender||'رجالي', material:r.material||r.Material||'', price:Number(r.price||r.Price)||0, cost:Number(r.cost||r.Cost)||0, barcode:String(r.barcode||r.Barcode||''), colors, sizes, images:[r.image||r.Image||placeholderImg(pname)]};
        DB.products.push(np);
        sizes.forEach(sz=>colors.forEach(c=>setInv(np.id,sz,c,0)));
        added++;
      });
      saveDB(); toast(`تم استيراد ${added} منتج ✓`,'ok'); render();
    }catch(err){ toast('تعذر قراءة الملف','err'); }
  };
  reader.readAsBinaryString(file);
}

/* ================= BARCODE SCANNER ================= */
let scannerInstance = null;
async function openScanner(onResult){
  // تشغيل الكاميرا يتطلب صفحة آمنة (https) أو localhost — يفشل غالباً لو الملف مفتوح مباشرة (file://)
  const secure = window.isSecureContext || location.protocol==='https:' || location.hostname==='localhost';
  if(!secure){
    toast('لازم تفتح التطبيق عبر رابط https أو تنشره أونلاين عشان الكاميرا تشتغل (فتح الملف مباشرة من الجهاز لا يكفي)','err');
    return;
  }
  if(typeof Html5Qrcode === 'undefined'){
    toast('مكتبة قراءة الباركود لم يتم تحميلها، تأكد من الاتصال بالإنترنت','err');
    return;
  }
  await stopScanner();
  openSheet(`<h3 style="font-family:Cairo;">مسح الباركود</h3>
    <div id="reader"></div>
    <div class="scan-hint" id="scanStatus">جارِ تشغيل الكاميرا…</div>
    <div style="display:flex; gap:8px; margin-top:10px;">
      <select class="field" id="scanCamSelect" style="flex:1; display:none;"></select>
    </div>
    <label class="fl" style="margin-top:10px;">أو ابحث عن باركود من صورة محفوظة</label>
    <input type="file" accept="image/*" class="field" id="scanFileInput">`);
  const statusEl = ()=> document.getElementById('scanStatus');

  const startWithCameraId = (camId)=>{
    scannerInstance = new Html5Qrcode('reader');
    scannerInstance.start(camId, {fps:10, qrbox:220}, text=>{
      onResult(text); stopScanner().then(closeSheet);
    }, ()=>{}).then(()=>{ if(statusEl()) statusEl().textContent='وجّه الكاميرا نحو باركود الكوتشي'; })
    .catch(err=>{
      console.error('scanner start error', err);
      if(statusEl()) statusEl().textContent = 'تعذر تشغيل الكاميرا، تأكد من إعطاء إذن الكاميرا للمتصفح ثم أعد المحاولة';
      toast('تعذر تشغيل الكاميرا، تأكد من صلاحيات المتصفح','err');
    });
  };

  try{
    const cams = await Html5Qrcode.getCameras();
    if(!cams || cams.length===0){
      if(statusEl()) statusEl().textContent = 'لا توجد كاميرا متاحة على هذا الجهاز';
      toast('لا توجد كاميرا متاحة، جرّب البحث عبر صورة محفوظة بدلاً من ذلك','err');
      return;
    }
    if(cams.length>1){
      const sel = document.getElementById('scanCamSelect');
      sel.style.display='block';
      sel.innerHTML = cams.map((c,i)=>`<option value="${c.id}">${c.label||('كاميرا '+(i+1))}</option>`).join('');
      const back = cams.find(c=> /back|environment|خلفي/i.test(c.label));
      if(back) sel.value = back.id;
      sel.addEventListener('change', ()=>{ stopScanner().then(()=> startWithCameraId(sel.value)); });
      startWithCameraId(sel.value);
    } else {
      startWithCameraId(cams[0].id);
    }
  }catch(err){
    console.error('getCameras error', err);
    if(statusEl()) statusEl().textContent = 'تعذر الوصول للكاميرا — تأكد من السماح بإذن الكاميرا لهذا الموقع من إعدادات المتصفح';
    toast('تعذر تشغيل الكاميرا، تأكد من صلاحيات المتصفح','err');
  }

  const fileInput = document.getElementById('scanFileInput');
  if(fileInput) fileInput.addEventListener('change', async (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    try{
      await stopScanner();
      const tmp = new Html5Qrcode('reader');
      const text = await tmp.scanFile(file, false);
      onResult(text); closeSheet();
    }catch(err){
      toast('لم يتم التعرف على باركود في هذه الصورة','err');
    }
  });
}
function stopScanner(){
  if(scannerInstance){
    const inst = scannerInstance;
    scannerInstance = null;
    return inst.stop().then(()=>inst.clear()).catch(()=>{});
  }
  return Promise.resolve();
}
function handleScanResult(code){
  const p = DB.products.find(x=>x.barcode===code);
  if(p){ renderProductSheet(p.id); toast('تم العثور على المنتج ✓','ok'); }
  else toast('لم يتم العثور على منتج بهذا الباركود','err');
}

  const btnProcessReturn = document.getElementById('btnProcessReturn');

  c.querySelectorAll('[data-del-return]').forEach(el=> el.addEventListener('click', ()=> deleteReturnLog(el.dataset.delReturn)));
  const btnSaveSettings = document.getElementById('btnSaveSettings');
  const btnDownloadCatalog = document.getElementById('btnDownloadCatalog');
  if(btnDownloadCatalog) btnDownloadCatalog.addEventListener('click', downloadPublicCatalog);
  const btnExportFbFeed = document.getElementById('btnExportFbFeed');
  if(btnExportFbFeed) btnExportFbFeed.addEventListener('click', downloadFacebookFeed);
  if(btnSaveSettings) btnSaveSettings.addEventListener('click', saveAdminSettings);

/* bindings for elements inside the bottom sheet only (product view/edit forms, scanner) */
function bindSheetDynamic(){
  const sheet = document.getElementById('sheetContent');
  if(!sheet) return;
  sheet.querySelectorAll('[data-pd-img]').forEach(el=> el.addEventListener('click', ()=>{ window._pdState.imgIdx = Number(el.dataset.pdImg); refreshProductSheet(); }));
  sheet.querySelectorAll('[data-pd-size]').forEach(el=> el.addEventListener('click', ()=>{ window._pdState.size = el.dataset.pdSize; refreshProductSheet(); }));
  sheet.querySelectorAll('[data-pd-color]').forEach(el=> el.addEventListener('click', ()=>{ window._pdState.color = el.dataset.pdColor; refreshProductSheet(); }));
  sheet.querySelectorAll('[data-pd-qty]').forEach(el=> el.addEventListener('click', ()=>{ window._pdState.qty = Math.max(1, window._pdState.qty + Number(el.dataset.pdQty)); refreshProductSheet(); }));
  const btnAddCart = sheet.querySelector('#btnAddCart');
  if(btnAddCart) btnAddCart.addEventListener('click', ()=>{ const s=window._pdState; addToCart(s.pid,s.size,s.color,s.qty); });
  const btnSaveProduct = sheet.querySelector('#btnSaveProduct');
  if(btnSaveProduct) btnSaveProduct.addEventListener('click', ()=> saveProduct(btnSaveProduct.dataset.pid || null));
  const pfCameraUpload = sheet.querySelector('#pfCameraUpload');
  if(pfCameraUpload) pfCameraUpload.addEventListener('change', e=>{ if(e.target.files.length) handleImageFiles(e.target.files); e.target.value=''; });
  const pfGalleryUpload = sheet.querySelector('#pfGalleryUpload');
  if(pfGalleryUpload) pfGalleryUpload.addEventListener('change', e=>{ if(e.target.files.length) handleImageFiles(e.target.files); e.target.value=''; });
  const btnAddImageUrl = sheet.querySelector('#btnAddImageUrl');
  if(btnAddImageUrl) btnAddImageUrl.addEventListener('click', ()=>{
    const url = sheet.querySelector('#pf_image_url').value.trim();
    if(!url){ toast('الصق رابط صورة أولاً','err'); return; }
    if((window._pfImages||[]).length>=4){ toast('أقصى عدد صور هو 4','err'); return; }
    window._pfImages.push(url); sheet.querySelector('#pf_image_url').value=''; renderPfImagesPreview();
  });
  sheet.querySelectorAll('[data-inv-cell]').forEach(el=> el.addEventListener('change', ()=>{
    const [pid,sz,cl] = el.dataset.invCell.split('|');
    setInv(pid,sz,cl, Math.max(0, Number(el.value)||0));
    saveDB(); toast('تم تحديث الكمية ✓','ok');
  }));
  const poSupplier = sheet.querySelector('#poSupplier');
  if(poSupplier) poSupplier.addEventListener('change', ()=>{ window._poDraft.supplierId = poSupplier.value; openSheet(purchaseOrderFormHTML()); });
  const poNewSupplierName = sheet.querySelector('#poNewSupplierName');
  if(poNewSupplierName) poNewSupplierName.addEventListener('change', ()=>{ window._poDraft.newSupplierName = poNewSupplierName.value; });
  const poNewSupplierPhone = sheet.querySelector('#poNewSupplierPhone');
  if(poNewSupplierPhone) poNewSupplierPhone.addEventListener('change', ()=>{ window._poDraft.newSupplierPhone = poNewSupplierPhone.value; });
  const btnAddPOItem = sheet.querySelector('#btnAddPOItem');
  if(btnAddPOItem) btnAddPOItem.addEventListener('click', ()=>{ window._poDraft.items.push({productId:'', color:'', size:'', qty:1, unitCost:0}); openSheet(purchaseOrderFormHTML()); });
  sheet.querySelectorAll('[data-remove-po-item]').forEach(el=> el.addEventListener('click', ()=>{
    window._poDraft.items.splice(Number(el.dataset.removePoItem),1);
    openSheet(purchaseOrderFormHTML());
  }));
  sheet.querySelectorAll('[data-po-item-field]').forEach(el=>{
    el.addEventListener('change', ()=>{
      const idx = Number(el.dataset.idx);
      const field = el.dataset.poItemField;
      const item = window._poDraft.items[idx];
      if(!item) return;
      if(field==='productId'){
        item.productId = el.value;
        const p = DB.products.find(x=>x.id===el.value);
        item.color = p? (p.colors[0]||'') : '';
        item.size = p? (p.sizes[0]||'') : '';
        item.unitCost = p? (p.cost||0) : 0;
        item.qty = item.qty || 1;
      } else if(field==='qty'){ item.qty = Math.max(1, Number(el.value)||1); }
      else if(field==='unitCost'){ item.unitCost = Number(el.value)||0; }
      else { item[field] = el.value; }
      openSheet(purchaseOrderFormHTML());
    });
  });
  const poDownPayment = sheet.querySelector('#poDownPayment');
  if(poDownPayment) poDownPayment.addEventListener('change', ()=>{ window._poDraft.downPayment = Number(poDownPayment.value)||0; openSheet(purchaseOrderFormHTML()); });
  const poInstallmentsCount = sheet.querySelector('#poInstallmentsCount');
  if(poInstallmentsCount) poInstallmentsCount.addEventListener('change', ()=>{ window._poDraft.installmentsCount = Math.max(1, Number(poInstallmentsCount.value)||1); openSheet(purchaseOrderFormHTML()); });
  const poFirstDueDate = sheet.querySelector('#poFirstDueDate');
  if(poFirstDueDate) poFirstDueDate.addEventListener('change', ()=>{ window._poDraft.firstDueDate = poFirstDueDate.value; openSheet(purchaseOrderFormHTML()); });
  const btnSavePO = sheet.querySelector('#btnSavePO');
  if(btnSavePO) btnSavePO.addEventListener('click', savePurchaseOrder);
  sheet.querySelectorAll('[data-receive-po]').forEach(el=> el.addEventListener('click', ()=> markPOReceived(el.dataset.receivePo)));

  const btnSaveSupplier = sheet.querySelector('#btnSaveSupplier');
  if(btnSaveSupplier) btnSaveSupplier.addEventListener('click', ()=> saveSupplier(btnSaveSupplier.dataset.sid || null));
  const btnAddSupplierTx = sheet.querySelector('#btnAddSupplierTx');
  if(btnAddSupplierTx) btnAddSupplierTx.addEventListener('click', ()=> addSupplierTx(btnAddSupplierTx.dataset.sid));
  sheet.querySelectorAll('[data-del-supplier-tx]').forEach(el=> el.addEventListener('click', ()=> deleteSupplierTx(el.dataset.delSupplierTx)));
  const btnAddInstallment = sheet.querySelector('#btnAddInstallment');
  if(btnAddInstallment) btnAddInstallment.addEventListener('click', ()=> addInstallment(btnAddInstallment.dataset.sid));
  sheet.querySelectorAll('[data-pay-installment]').forEach(el=> el.addEventListener('click', ()=> payInstallment(el.dataset.payInstallment)));
  sheet.querySelectorAll('[data-del-installment]').forEach(el=> el.addEventListener('click', ()=> deleteInstallment(el.dataset.delInstallment)));
  const btnSaveDistributor = sheet.querySelector('#btnSaveDistributor');
  if(btnSaveDistributor) btnSaveDistributor.addEventListener('click', ()=> saveDistributor(btnSaveDistributor.dataset.did || null));
  const btnAddDistributorTx = sheet.querySelector('#btnAddDistributorTx');
  if(btnAddDistributorTx) btnAddDistributorTx.addEventListener('click', ()=> addDistributorTx(btnAddDistributorTx.dataset.did));
  sheet.querySelectorAll('[data-del-distributor-tx]').forEach(el=> el.addEventListener('click', ()=> deleteDistributorTx(el.dataset.delDistributorTx)));
  sheet.querySelectorAll('[data-open-supplier]').forEach(el=> el.addEventListener('click', ()=> openSupplierLedger(el.dataset.openSupplier)));

  const btnSaveCustomer = sheet.querySelector('#btnSaveCustomer');
  if(btnSaveCustomer) btnSaveCustomer.addEventListener('click', ()=> saveCustomer(btnSaveCustomer.dataset.cid || null));
  const btnSaveExpense = sheet.querySelector('#btnSaveExpense');
  if(btnSaveExpense) btnSaveExpense.addEventListener('click', ()=> saveExpense(btnSaveExpense.dataset.eid));
  const exEditCameraUpload = sheet.querySelector('#exEditCameraUpload');
  if(exEditCameraUpload) exEditCameraUpload.addEventListener('change', e=>{ if(e.target.files.length) handleExpenseImageFiles(e.target.files, 'exEditImagesPreview', window._exEditImages); e.target.value=''; });
  const exEditGalleryUpload = sheet.querySelector('#exEditGalleryUpload');
  if(exEditGalleryUpload) exEditGalleryUpload.addEventListener('change', e=>{ if(e.target.files.length) handleExpenseImageFiles(e.target.files, 'exEditImagesPreview', window._exEditImages); e.target.value=''; });
  const btnSaveOrder = sheet.querySelector('#btnSaveOrder');
  if(btnSaveOrder) btnSaveOrder.addEventListener('click', ()=> saveOrderEdit(btnSaveOrder.dataset.oid));
  const btnSaveShipping = sheet.querySelector('#btnSaveShipping');
  if(btnSaveShipping) btnSaveShipping.addEventListener('click', ()=> saveShipping(btnSaveShipping.dataset.oid));
  const btnCopyDeviceId2 = sheet.querySelector('#btnCopyDeviceId2');
  if(btnCopyDeviceId2) btnCopyDeviceId2.addEventListener('click', ()=> copyToClipboard(dbMeta.shopCode||''));
  const btnBuyLicenseWa2 = sheet.querySelector('#btnBuyLicenseWa2');
  if(btnBuyLicenseWa2) btnBuyLicenseWa2.addEventListener('click', ()=>{
    const shopName = (DB.settings && DB.settings.shopName) || 'محل';
    const msg = `أهلاً، عايز أفعّل تطبيق الكوتشيات%0Aاسم المحل: ${shopName}%0Aكود المحل: ${dbMeta.shopCode||''}`;
    window.open(`https://wa.me/201120001343?text=${msg}`, '_blank');
  });
  const btnActivateNow2 = sheet.querySelector('#btnActivateNow2');
  if(btnActivateNow2) btnActivateNow2.addEventListener('click', ()=>{
    const code = sheet.querySelector('#licCodeInput2').value;
    if(tryActivate(code)){ toast('تم تفعيل التطبيق ✓','ok'); closeSheet(); render(); }
    else toast('كود التفعيل غير صحيح','err');
  });
}

/* ================= حالة الاتصال بالإنترنت (Online/Offline Banner) ================= */
function ensureConnBanner(){
  let b = document.getElementById('connStatusBanner');
  if(!b){
    b = document.createElement('div');
    b.id = 'connStatusBanner';
    b.style.cssText = 'display:none; position:sticky; top:0; z-index:999; text-align:center; padding:7px 10px; font-size:12.5px; font-weight:700; background:#7a4d00; color:#fff;';
    document.body.insertBefore(b, document.body.firstChild);
  }
  return b;
}
function updateConnBanner(){
  const b = ensureConnBanner();
  if(navigator.onLine === false){
    b.textContent = '🔌 مفيش اتصال بالإنترنت — بتشتغل من آخر نسخة محفوظة، والتعديلات هتتزامن تلقائي أول ما النت يرجع';
    b.style.display = 'block';
  } else {
    b.style.display = 'none';
  }
}
window.addEventListener('online', updateConnBanner);
window.addEventListener('offline', updateConnBanner);

/* ================= INIT (بوابة الدخول السحابية) ================= */
document.getElementById('bottomNav').style.display = 'none';
document.getElementById('mainContainer').innerHTML = '<div style="text-align:center; padding:60px 20px; color:var(--muted);">⏳ جاري الاتصال بالسحابة...</div>';
updateConnBanner();
let _authResolved = false;
setTimeout(()=>{
  if(_authResolved) return;
  const raw = localStorage.getItem(DB_KEY);
  if(raw){
    // مفيش رد من السحابة لحد دلوقتي، بس عندنا نسخة محفوظة على الجهاز - نشتغل بيها فورًا
    try{
      DB = JSON.parse(raw);
      ensureDBDefaults();
      DB.currentView = localStorage.getItem(VIEW_KEY) || 'shop';
      const b = ensureConnBanner();
      b.textContent = '🔌 بتشتغل من آخر نسخة محفوظة على الجهاز — هيتزامن تلقائي أول ما الاتصال بالسحابة يرجع';
      b.style.display = 'block';
      setNav(DB.currentView);
    }catch(e){
      document.getElementById('mainContainer').innerHTML = '<div style="text-align:center; padding:60px 20px; color:var(--muted);">⚠️ الاتصال بالسحابة بياخد وقت أطول من المعتاد.<br><br><button class="big-btn ghost sm" onclick="location.reload()" style="margin-top:14px;">🔄 إعادة تحميل الصفحة</button></div>';
    }
  } else {
    document.getElementById('mainContainer').innerHTML = '<div style="text-align:center; padding:60px 20px; color:var(--muted);">⚠️ الاتصال بالسحابة بياخد وقت أطول من المعتاد.<br><br><button class="big-btn ghost sm" onclick="location.reload()" style="margin-top:14px;">🔄 إعادة تحميل الصفحة</button></div>';
  }
}, 12000);
fbAuth.onAuthStateChanged(function(user){
  _authResolved = true;
  if(user){
    fbUser = user;
    subscribeShop(user.uid);
  } else {
    fbUser = null; DB = null; dbMeta = {};
    if(unsubscribeShop){ unsubscribeShop(); unsubscribeShop=null; }
    if(unsubscribeOrders){ unsubscribeOrders(); unsubscribeOrders=null; }
    document.getElementById('bottomNav').style.display = 'none';
    const c = document.getElementById('mainContainer');
    c.innerHTML = renderLoginGate('login');
    bindLoginGate('login');
  }
});
</script>
